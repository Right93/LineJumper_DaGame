function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function makeRng(seed) {
  var r = mulberry32(seed >>> 0);
  return {
    next: r,
    range: function (a, b) { return a + r() * (b - a); },
    int: function (a, b) { return Math.floor(a + r() * (b - a + 1)); },
    pick: function (arr) { return arr[Math.floor(r() * arr.length)]; },
    chance: function (p) { return r() < p; }
  };
}

function newCanvas(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function ctxOf(c) { var x = c.getContext('2d'); x.imageSmoothingEnabled = false; return x; }

function rect(g, x, y, w, h, col) {
  g.fillStyle = col;
  g.fillRect(Math.round(x), Math.round(y), Math.max(1, Math.round(w)), Math.max(1, Math.round(h)));
}
function pixel(g, x, y, col) { g.fillStyle = col; g.fillRect(x | 0, y | 0, 1, 1); }

function roundRectPath(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.lineTo(x + w - r, y);
  g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r);
  g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  g.lineTo(x + r, y + h);
  g.quadraticCurveTo(x, y + h, x, y + h - r);
  g.lineTo(x, y + r);
  g.quadraticCurveTo(x, y, x + r, y);
  g.closePath();
}

function lerpColor(a, b, t) {
  function hex(c) { return [parseInt(c.substr(1, 2), 16), parseInt(c.substr(3, 2), 16), parseInt(c.substr(5, 2), 16)]; }
  var A = hex(a), B = hex(b);
  return 'rgb(' + Math.round(lerp(A[0], B[0], t)) + ',' + Math.round(lerp(A[1], B[1], t)) + ',' + Math.round(lerp(A[2], B[2], t)) + ')';
}

function glyphW(ch) { var gl = FONT[ch]; return gl ? gl[0].length : 4; }

function textW(str, scale, spacing) {
  scale = scale || 1; spacing = spacing === undefined ? 1 : spacing;
  var w = 0;
  for (var i = 0; i < str.length; i++) w += glyphW(str[i]) * scale + spacing * scale;
  return w - spacing * scale;
}

function drawText(g, str, x, y, col, scale, spacing) {
  scale = scale || 1; spacing = spacing === undefined ? 1 : spacing;
  str = String(str).toUpperCase();
  var cx = x;
  g.fillStyle = col;
  for (var i = 0; i < str.length; i++) {
    var gl = FONT[str[i]];
    if (gl) {
      for (var ry = 0; ry < gl.length; ry++) {
        var row = gl[ry];
        for (var rx = 0; rx < row.length; rx++) {
          if (row[rx] !== '.' && row[rx] !== ' ') g.fillRect(cx + rx * scale, y + ry * scale, scale, scale);
        }
      }
      cx += (glyphW(str[i]) + spacing) * scale;
    } else cx += 4 * scale;
  }
  return cx;
}

function drawTextOutline(g, str, x, y, col, outline, scale, spacing) {
  spacing = spacing === undefined ? 1 : spacing;
  for (var dx = -1; dx <= 1; dx++)
    for (var dy = -1; dy <= 1; dy++)
      if (dx || dy) drawText(g, str, x + dx * scale, y + dy * scale, outline, scale, spacing);
  drawText(g, str, x, y, col, scale, spacing);
}

function drawTextCenter(g, str, cx, y, col, scale, spacing) {
  drawText(g, str, cx - textW(str, scale, spacing) / 2, y, col, scale, spacing);
}

function drawTextCenterOutline(g, str, cx, y, col, outline, scale, spacing) {
  drawTextOutline(g, str, cx - textW(str, scale, spacing) / 2, y, col, outline, scale, spacing);
}

function compile(rows, pal) {
  var w = 0, h = rows.length, i;
  for (i = 0; i < h; i++) if (rows[i].length > w) w = rows[i].length;
  var c = newCanvas(w, h), g = ctxOf(c);
  for (var y = 0; y < h; y++) {
    var row = rows[y];
    for (var x = 0; x < row.length; x++) {
      var col = pal[row[x]];
      if (col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); }
    }
  }
  return { c: c, w: w, h: h };
}

function blit(g, s, x, y, flip, alpha) {
  x = Math.round(x); y = Math.round(y);
  var a = alpha === undefined ? 1 : alpha;
  if (a !== 1) g.globalAlpha = a;
  if (flip) {
    g.save(); g.translate(x + s.w, y); g.scale(-1, 1); g.drawImage(s.c, 0, 0); g.restore();
  } else g.drawImage(s.c, x, y);
  if (a !== 1) g.globalAlpha = 1;
}

function rotateSprite(s, deg, pad) {
  var d = Math.ceil(Math.sqrt(s.w * s.w + s.h * s.h)) + (pad === undefined ? 2 : pad);
  var c = newCanvas(d, d), g = ctxOf(c);
  g.translate(d / 2, d / 2);
  g.rotate(deg * Math.PI / 180);
  g.drawImage(s.c, -Math.round(s.w / 2), -Math.round(s.h / 2));
  return { c: c, w: d, h: d };
}

function mergeRows(a, b) {
  var out = [], i, x, ra, rb, ca, cb, s, w;
  for (i = 0; i < a.length; i++) {
    ra = a[i]; rb = b[i] || '';
    w = Math.max(ra.length, rb.length);
    s = '';
    for (x = 0; x < w; x++) {
      ca = x < ra.length ? ra[x] : '.';
      cb = x < rb.length ? rb[x] : '.';
      s += (cb !== '.' ? cb : ca);
    }
    out.push(s);
  }
  return out;
}

function composeRun(body) {
  var out = [];
  for (var i = 0; i < RUN_LEGS.length; i++) {
    out.push(body.concat(mergeRows(LEG_SHAPES[RUN_LEGS[i][0]], LEG_SHAPES[RUN_LEGS[i][1]])));
  }
  return out;
}

function outfitPalette(id) {
  var of = OUTFITS[id] || OUTFITS.detective;
  var pal = {};
  for (var k in PP) pal[k] = PP[k];
  if (of.pal) for (var k2 in of.pal) pal[k2] = of.pal[k2];
  return pal;
}

var artCache = {};

function buildArt(outfitId) {
  if (!OUTFITS[outfitId]) outfitId = 'detective';
  if (artCache[outfitId]) return artCache[outfitId];
  var pal = outfitPalette(outfitId);
  var BODY = HATS[OUTFITS[outfitId].hat].concat(BODY_REST);
  var art = {};
  var frames = composeRun(BODY);
  art.run = [];
  for (var f = 0; f < frames.length; f++) art.run.push(compile(frames[f], pal));
  art.idle = compile(BODY.concat(mergeRows(LEG_SHAPES.plant, LEG_SHAPES.plant)), pal);
  art.recover = [compile(RECOVER0, pal), compile(RECOVER1, pal), compile(RECOVER2, pal)];
  art.tuck = [];
  for (var i = 0; i < 12; i++) art.tuck.push(rotateSprite(compile(TUCK, pal), i * 30));
  art.fall = [compile(FALL0, pal), compile(FALL1, pal)];
  art.branch = compile([
    '..K....KK.',
    '.KbK..KbK.',
    'KbbK.KbK..',
    '.KbKKbbK..',
    '..KbbbbK..',
    '...KKKK...'

  art.crowSit = compile(['.KK..', 'KKKK.', 'KKKKK', '.KeK.'], { 'K': '#191420', 'e': '#ff6a4a' });

  art.shoes = compile(['..K..', '..K..', '..K..', '.K.K.', '.KKK.', '.K.K.'], { 'K': '#221a26' });

  return art;
}

  var p = player;

      spr = art.recover[f];
    } else {
      f = Math.floor(p.animT * afps) % 8;
      spr = art.run[f];
    }
    var bob = land ? 0 : [0, 1, 0, -1][f % 4];
    var top = p.y + cam.sy + bob - (spr.h - 1);
    blit(g, spr, sx - 7, top, false, alpha);
    var swing = land ? -0.08 : Math.sin(p.animT * afps * 0.5) * 0.16;
    drawCane(sx + 3, top + (land ? 12 : 16), 0.42 + swing, alpha);
  } else if (p.state === 'air') {
    var prog = clamp(p.flipT / FLIP_T, 0, 1);
    var rot = prog * prog * (3 - 2 * prog) * 360;
    var idx = Math.floor(rot / 30) % 12;
    var ts = art.tuck[idx];
    var cx2 = sx, cy2 = p.y + cam.sy - 16;
    g.globalAlpha = alpha;
    blit(g, ts, cx2 - ts.w / 2, cy2 - ts.h / 2);
    g.globalAlpha = 1;
    var ang = rot * Math.PI / 180;
    var ox = 4, oy = -5;
    var hx = cx2 + ox * Math.cos(ang) - oy * Math.sin(ang);
    var hy = cy2 + ox * Math.sin(ang) + oy * Math.cos(ang);
    drawCane(hx, hy, ang + 0.9, alpha);
    g.globalAlpha = 0.16;
    g.fillStyle = '#dfe8f5';
    for (var w = 0; w < 3; w++) g.fillRect(Math.round(sx - 14 - w * 7), Math.round(p.y - 10 - w * 3), 5, 1);
    g.globalAlpha = 1;
  } else if (p.state === 'drop' || p.state === 'fall') {
    var fs = Math.floor(p.animT * 9) % 2;
    var fspr = art.fall[fs];
    blit(g, fspr, sx - 7, p.y + cam.sy - (fspr.h - 1), false, alpha);
    drawCane(sx + 4, p.y + cam.sy - 15, 2.1, alpha);
  } else if (p.state === 'dead') {
    var idx2 = Math.floor(p.deadT * 9) % 12;
    var ts2 = art.tuck[idx2];
    blit(g, ts2, sx - ts2.w / 2, p.y + cam.sy - 16 - ts2.h / 2, false, Math.max(0, 1 - p.deadT * 0.5));
  }
}

function drawCane(x, y, theta, alpha) {
  g.globalAlpha = alpha === undefined ? 1 : alpha;
  var dx = Math.sin(theta), dy = Math.cos(theta);
  for (var i = 0; i < 8; i++) {
    g.fillStyle = i < 6 ? '#7c5230' : '#b8863f';
    g.fillRect(Math.round(x + dx * i), Math.round(y + dy * i), 1, 1);
  }
  g.fillStyle = '#efe6d8';
  g.fillRect(Math.round(x), Math.round(y), 1, 1);
  g.globalAlpha = 1;
}

function blitScaled(s, x, y, k, flip) {
  if (flip) { g.save(); g.translate(x + s.w * k, y); g.scale(-1, 1); g.drawImage(s.c, 0, 0, s.w * k, s.h * k); g.restore(); }
  else g.drawImage(s.c, Math.round(x), Math.round(y), s.w * k, s.h * k);
}

function runSheet() {
  g.fillStyle = '#161122';
  g.fillRect(0, 0, W, H);
  var i, s, k = 2;
  for (i = 0; i < 8; i++) {
    var row = i < 4 ? 0 : 1;
    var col = i % 4;
    var x = 8 + col * 94, footY = 78 + row * 72;
    s = art.run[i];
    var top = footY - (s.h - 1) * k;
    blitScaled(s, x, top, k, false);
    drawCane(x + 10 * k, top + 16 * k, 0.42, 1);
    rect(g, x, footY + 2, 60, 1, '#3a3450');
    drawText(g, 'F' + i + ' BOB' + ([0, 1, 0, -1][i % 4]), x, footY + 5, '#9fb6d8', 1);
  }
  drawText(g, 'RECOVER 1X', 6, 163, '#ffe9a8', 1);
  var ry = 208;
  for (i = 0; i < 3; i++) { s = art.recover[i]; blit(g, s, 8 + i * 26, ry - (s.h - 1), false); }
  drawText(g, 'IMPACT CROUCH RISE', 6, 210, '#9fb6d8', 1);
  drawText(g, 'FALL 1X', 92, 163, '#ffe9a8', 1);
  for (i = 0; i < 2; i++) { s = art.fall[i]; blit(g, s, 92 + i * 22, ry - (s.h - 1), false); }
  drawText(g, 'FLIP 1X', 148, 163, '#ffe9a8', 1);
  for (i = 0; i < 6; i++) { s = art.tuck[i * 2]; blit(g, s, 148 + i * 20, ry - s.h + 8, false); }
  compositeScene();
}

/* LINE JUMPER - world

var SKY_STOPS = [
  [0.00, '#0a0817'], [0.30, '#191130'], [0.50, '#2b1640'], [0.62, '#4b2044'],
  [0.72, '#7a3543'], [0.80, '#a95243'], [0.855, '#cf7a4c'], [0.90, '#7c4038'],
  [0.95, '#33202e'], [1.00, '#161020']
];

function skyColorAt(t) {
  for (var i = 0; i < SKY_STOPS.length - 1; i++) {
    var a = SKY_STOPS[i], b = SKY_STOPS[i + 1];
    if (t >= a[0] && t <= b[0]) return lerpColor(a[1], b[1], (t - a[0]) / (b[0] - a[0]));
  }
  return SKY_STOPS[SKY_STOPS.length - 1][1];
}

function buildSky(rng) {
  var c = newCanvas(W, H), g = ctxOf(c);
  for (var y = 0; y < H; y++) {

  }
  for (var y2 = 0; y2 < H; y2 += 8) {

  for (var st = 0; st < 46; st++) {

  }
  g.globalAlpha = 1;
  g.fillStyle = '#d8d3c4';
  g.beginPath(); g.arc(mx, my, 10, 0, 7); g.fill();
  g.fillStyle = '#efe9da';
  g.beginPath(); g.arc(mx - 1, my - 1, 9, 0, 7); g.fill();
  g.fillStyle = '#c9c2b0';
  g.fillRect(mx - 5, my - 3, 3, 2);
  g.fillRect(mx + 1, my + 2, 4, 3);
  g.fillRect(mx - 2, my + 5, 3, 2);
  g.fillRect(mx + 4, my - 4, 2, 2);
  g.globalAlpha = 0.35;
  g.fillStyle = '#2a1a38';
  g.fillRect(mx - 12, my + 5, 26, 2);
  g.fillRect(mx - 4, my - 9, 20, 1);
  g.globalAlpha = 1;
  var sunX = 92, sunY = 152;
  for (var i = 3; i >= 1; i--) {
    g.globalAlpha = 0.045 * i;
    g.fillStyle = '#ff9a5c';
    g.beginPath(); g.arc(sunX, sunY, 13 * (0.55 + i * 0.35), 0, 7); g.fill();
  }
  g.globalAlpha = 1;
  g.fillStyle = '#e8a062';
  g.beginPath(); g.arc(sunX, sunY, 13, 0, 7); g.fill();
  g.fillStyle = '#f2bb84';
  g.beginPath(); g.arc(sunX, sunY, 9, 0, 7); g.fill();
  for (var s = 0; s < 6; s++) {
    var cy = rng.int(36, 132), cx = rng.int(0, W), cw = rng.int(40, 130);

    g.fillRect(cx + rng.int(0, 20), cy + 2, Math.max(4, cw - 12), 1);

function buildFar(rng) {

  g.fillStyle = '#160f24';
  g.fillRect(tx2, deck - 9, tlen, 9);
  g.fillStyle = '#0f0a1a';
  g.fillRect(tx2 + 4, deck - 11, tlen - 8, 2);
  for (var wx = tx2 + 6; wx < tx2 + tlen - 6; wx += 7) {
    g.globalAlpha = 0.55 + rng.next() * 0.3;

    g.globalAlpha = 1;

  g.fillStyle = '#231a36';
  g.fillRect(0, 168, TW, 3);
  for (var lx = 0; lx < TW; lx += 3) {
    if (rng.chance(0.55)) {

      g.globalAlpha = 0.7;
      g.fillRect(lx, 169, 1, 1);

    g.globalAlpha = 0.04;
    g.fillStyle = '#ff9a5a';

function neon(g, x, y, w, h, col, rng) {
  g.globalAlpha = 0.07; g.fillStyle = col; g.fillRect(x - 3, y - 3, w + 6, h + 6);
  g.globalAlpha = 0.12; g.fillRect(x - 2, y - 2, w + 4, h + 4);
  g.globalAlpha = 0.22; g.fillRect(x - 1, y - 1, w + 2, h + 2);
  g.globalAlpha = 1;
  g.fillStyle = col; g.fillRect(x, y, w, h);
  var n = Math.max(2, Math.floor(h / 7));
  for (var i = 0; i < n; i++) {
    g.fillStyle = '#fff6e6';
    g.globalAlpha = 0.85;
    g.fillRect(x + 1 + rng.int(0, Math.max(0, w - 2)), y + 2 + i * Math.floor(h / n), 1, 1);
    g.globalAlpha = 1;
  }
}

function buildMid(rng) {
  var TW = 1152, c = newCanvas(TW, H), g = ctxOf(c);
  var vents = [];
  var tops = [];
  var x = 0;
  while (x < TW) {
    var bw = rng.int(28, 68), bh = rng.int(26, 76);
    var top = 194 - bh;
    var base = rng.pick(['#120c1e', '#0f0a1a', '#151022', '#100b1c']);
    g.fillStyle = base;
    g.fillRect(x, top, bw, bh + 6);
    g.fillStyle = lerpColor(base, '#5c3f70', 0.7);
    g.fillRect(x, top, bw, 1);
    g.fillStyle = '#060409';
    g.fillRect(x + bw - 1, top, 1, bh + 6);
    for (var gy = top + 4; gy < 190; gy += 5) {
      for (var gx = x + 2; gx < x + bw - 3; gx += 4) {
        if (rng.chance(0.1)) {
          g.globalAlpha = 0.3 + rng.next() * 0.5;
          g.fillStyle = rng.chance(0.7) ? '#e8b06a' : '#6fd2e8';
          g.fillRect(gx, gy, 2, 2);
          g.globalAlpha = 1;
        }
      }
    }
    if (rng.chance(0.4)) {
      var rw = rng.int(6, Math.max(6, Math.min(16, bw - 4)));
      var rx2 = x + rng.int(1, Math.max(1, bw - rw - 1));
      g.fillStyle = '#1b1428'; g.fillRect(rx2, top - 3, rw, 3);
      g.fillStyle = '#2c2140'; g.fillRect(rx2, top - 3, rw, 1);
      if (rng.chance(0.5)) { g.fillStyle = '#1b1428'; g.fillRect(rx2 + 2, top - 8, rw - 4, 5); }
    }
    if (rng.chance(0.35)) {
      var ax2 = x + rng.int(2, Math.max(2, bw - 3)), ah2 = rng.int(6, 18);
      g.fillStyle = '#0a0712'; g.fillRect(ax2, top - ah2, 1, ah2);
      g.fillRect(ax2 - 2, top - ah2 + 5, 5, 1);
      if (rng.chance(0.3)) { g.fillStyle = '#ff5a4a'; g.fillRect(ax2, top - ah2 - 1, 1, 1); }
    }
    if (rng.chance(0.62)) {
      var sw = rng.int(3, 7);
      var sx = x + rng.int(1, Math.max(1, bw - sw - 1)), sy = top + rng.int(2, 12);
      var sh = Math.min(rng.int(14, 34), Math.max(9, top + bh - 10 - sy));
      if (sh >= 9) neon(g, sx, sy, sw, sh, rng.pick(['#ff2f7e', '#22d3ff', '#ffb545', '#ff5a3c', '#a05cff']), rng);
    }
    if (rng.chance(0.42)) {
      var hw = rng.int(12, Math.max(12, Math.min(34, bw))), hh = rng.int(4, 6);
      var hx = x + rng.int(1, Math.max(1, bw - hw - 1)), hy = top + rng.int(10, Math.max(11, bh - 12));
      neon(g, hx, hy, hw, hh, rng.pick(['#ff2f7e', '#22d3ff', '#ffb545', '#4de0a0']), rng);
    }
    if (rng.chance(0.32)) {
      g.fillStyle = '#1d1630';
      g.fillRect(x + 2, top + 4, 1, bh - 6);
      for (var py = top + 6; py < 190; py += 7) g.fillRect(x + 1, py, 3, 1);
    }
    if (rng.chance(0.3)) {
      var aw = rng.int(3, 5), ay = top + rng.int(6, 26);
      g.fillStyle = '#1d1630'; g.fillRect(x + Math.max(1, bw - 5), ay, aw, 4);
      g.fillRect(x + Math.max(1, bw - 5) + 1, ay + 4, aw - 2, 2);
    }
    if (rng.chance(0.28)) vents.push({ x: x + bw / 2, y: top + 2 });
    tops.push({ x: x, w: bw, y: top });
    x += bw + rng.int(2, 12);
  }
  for (var i = 0; i < 22; i++) {
    var a = tops[Math.floor(rng.next() * tops.length)];

    if (Math.abs(a.x - b.x) < 30) continue;
    var x1 = a.x + a.w, x2 = b.x;

    var ly = Math.min(a.y, b.y) + rng.int(6, 26);
    g.fillStyle = '#2a1e38';
    g.fillRect(x1, ly, x2 - x1, 1);
    for (var k = 0; k < 3; k++) {

  }
  for (var tt = 0; tt < 26; tt++) {
    var lx = rng.int(20, TW - 20), ly2 = rng.int(120, 186), lw = rng.int(24, 70);
    g.fillStyle = '#241a34';
    g.fillRect(lx, ly2, lw, 1);
    var n = rng.int(2, 5);
    for (var k2 = 0; k2 < n; k2++) {

  return { c: c, vents: vents };
}

function buildTunnel(rng) {

/* ============================ scenery themes ============================
   Every scenery is a module of the same shape: sky / far / mid / near /
   ground tile builders plus a few flags. The render pipeline, the parallax
   draw and the wire/pole layout are shared - a scenery only swaps the asset
   set and the palette, never the gameplay geometry.

   Art direction for the newer sets: soft painterly colour grading, warm
   natural light, lush and slightly idealised - gentle gradients, rounded
   organic masses and haze between layers instead of hard neon edges. */

function gradRows(g, y0, y1, w, stops) {
  for (var y = y0; y < y1; y++) {
    var t = (y - y0) / Math.max(1, y1 - y0 - 1);
    g.fillStyle = skyColorAt2(stops, t);
    g.fillRect(0, y, w, 1);
  }
}

function skyColorAt2(stops, t) {
  for (var i = 0; i < stops.length - 1; i++) {
    var a = stops[i], b = stops[i + 1];
    if (t >= a[0] && t <= b[0]) return lerpColor(a[1], b[1], (t - a[0]) / Math.max(0.0001, b[0] - a[0]));
  }
  return stops[stops.length - 1][1];
}

function softGlow(g, x, y, r, col, aMax) {
  for (var i = 4; i >= 1; i--) {
    g.globalAlpha = aMax * (i / 4);
    g.fillStyle = col;
    g.beginPath(); g.arc(x, y, r * (0.35 + i * 0.2), 0, 7); g.fill();
  }
  g.globalAlpha = 1;
}

function blob(g, x, y, w, h, col) {
  g.fillStyle = col;
  g.beginPath();
  g.ellipse(x, y, w / 2, h / 2, 0, 0, 7);
  g.fill();
}

function hill(g, x, baseY, w, h, col) {
  g.fillStyle = col;
  g.beginPath();
  g.moveTo(x - w / 2, baseY);
  g.quadraticCurveTo(x - w * 0.22, baseY - h, x, baseY - h);
  g.quadraticCurveTo(x + w * 0.22, baseY - h, x + w / 2, baseY);
  g.closePath();
  g.fill();
}

function hazeBand(g, y0, y1, col, aTop, aBot) {
  var grd = g.createLinearGradient(0, y0, 0, y1);
  grd.addColorStop(0, 'rgba(0,0,0,0)');
  grd.addColorStop(0.5, col);
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.globalAlpha = aTop;
  g.fillStyle = grd;
  g.fillRect(0, y0, 2048, y1 - y0);
  g.globalAlpha = 1;
}

/* LINE JUMPER - audio
   Synthesised SFX plus the background music track (bgm.mp3 in the project
   root; build.js inlines it as a data URI in dist/index.html).

   Why the old music was silent: it was a scheduled WebAudio pad whose gain sat
   under the master chain and only started if init() had run inside a user
   gesture, so in practice nothing was ever heard. Music is now a real media
   element, and its state is reported by audio.bgmDebug() so the audio check
   mode can prove playback (currentTime advancing) instead of assuming it. */
'use strict';

var BGM_SRC = 'bgm.mp3';
var BGM_FALLBACKS = ['bgm.ogg', 'bgm.wav'];
var BGM_OVERRIDE = (function () {
  try { return new URLSearchParams(location.search).get('bgm'); } catch (e) { return null; }
})();

var audio = (function () {
  var ac = null, master, sfxG, musG, rumbleG, noiseBuf, muted = false, rumbleValue = 0.13;

  function makeNoise(sec) {
    var n = Math.floor(ac.sampleRate * sec), b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }

  function init() {
    if (ac) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ac = new AC(); } catch (e) { ac = null; return; }
    master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination);
    sfxG = ac.createGain(); sfxG.gain.value = 0.6; sfxG.connect(master);
    musG = ac.createGain(); musG.gain.value = 0; musG.connect(master);
    noiseBuf = makeNoise(2);
    var src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    var lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 120; lp.Q.value = 0.4;
    rumbleG = ac.createGain(); rumbleG.gain.value = 0;
    src.connect(lp); lp.connect(rumbleG); rumbleG.connect(master); src.start();
  }

  function tone(f0, f1, dur, type, vol, dest, atk) {
    if (!ac) return;
    var t = ac.currentTime, o = ac.createOscillator(), gn = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    var a = atk === undefined ? 0.005 : atk;
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.exponentialRampToValueAtTime(vol, t + a);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(gn); gn.connect(dest || sfxG);
    o.start(t); o.stop(t + dur + 0.02);
  }

  function noise(dur, vol, f0, f1, q, dest) {
    if (!ac) return;
    var t = ac.currentTime, s = ac.createBufferSource(), gn = ac.createGain(), f = ac.createBiquadFilter();
    s.buffer = noiseBuf; s.loop = true;
    f.type = 'lowpass'; f.frequency.setValueAtTime(f0, t);
    f.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur);
    f.Q.value = q || 1;
    gn.gain.setValueAtTime(vol, t);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(gn); gn.connect(dest || sfxG);
    s.start(t); s.stop(t + dur + 0.05);
  }

  /* ---- background music (media element) ---- */
  var bgmEl = null, bgmIdx = 0, bgmLastErr = '';

  function bgmList() { return BGM_OVERRIDE ? [BGM_OVERRIDE] : [BGM_SRC].concat(BGM_FALLBACKS); }

  function bgmInit() {
    if (bgmEl || typeof Audio === 'undefined') return;
    var list = bgmList();
    bgmEl = new Audio();
    bgmEl.loop = true;
    bgmEl.preload = 'auto';
    bgmEl.volume = 0.45;
    bgmEl.muted = muted;
    bgmEl.addEventListener('error', function () {
      var l = bgmList();
      bgmLastErr = 'error loading ' + l[Math.min(bgmIdx, l.length - 1)];
      bgmIdx++;
      if (bgmIdx < l.length) {
        bgmEl.src = l[bgmIdx];
        if (bgmWanted) bgmTry();
      }
    });
    bgmEl.src = list[0];
  }

  var bgmWanted = false;
  function bgmTry() {
    if (!bgmEl) return;
    var pr = bgmEl.play();
    if (pr && pr.catch) {
      pr.catch(function (err) { bgmLastErr = 'play blocked: ' + (err && err.message ? err.message : err); });
    }
  }

  return {
    init: init,
    ok: function () { return !!ac; },
    resume: function () { if (ac && ac.state === 'suspended') ac.resume(); },

    musicStart: function () {
      bgmInit();
      bgmWanted = true;
      if (!bgmEl) return;
      if (bgmEl.currentTime > 0.05) bgmEl.currentTime = 0;
      bgmEl.muted = muted;
      bgmTry();
    },
    musicPlay: function () {
      bgmInit();
      bgmWanted = true;
      if (!bgmEl) return;
      bgmEl.muted = muted;
      bgmTry();
    },
    musicPause: function () { if (bgmEl && !bgmEl.paused) bgmEl.pause(); },
    musicStop: function () {
      if (!bgmEl) return;
      bgmWanted = false;
      if (!bgmEl.paused) bgmEl.pause();
      try { bgmEl.currentTime = 0; } catch (e) { }
    },
    bgmDebug: function () {
      if (!bgmEl) return 'no element';
      var src = String(bgmEl.src || '');
      var name = src.slice(0, 5) === 'data:' ? 'embedded(' + Math.round(src.length / 1024) + 'kb)' : src.split('/').pop();
      var dur = isFinite(bgmEl.duration) ? bgmEl.duration.toFixed(1) + 's' : '?';
      return name + ' rdy' + bgmEl.readyState + ' dur' + dur + ' t' + bgmEl.currentTime.toFixed(2) + (bgmEl.paused ? ' PAUSED' : ' PLAYING') + (bgmLastErr ? ' [' + bgmLastErr + ']' : '');
    },

    setRumble: function (v) {
      rumbleValue = v;
      if (!ac) return;
      rumbleG.gain.linearRampToValueAtTime(v, ac.currentTime + 0.6);
    },
    toggleMute: function () {
      muted = !muted;
      if (ac) master.gain.linearRampToValueAtTime(muted ? 0 : 0.5, ac.currentTime + 0.1);
      if (bgmEl) bgmEl.muted = muted;
      return muted;
    },
    isMuted: function () { return muted; },

    jump: function () { tone(320, 620, 0.16, 'triangle', 0.28); noise(0.18, 0.12, 1800, 300, 1); },
    land: function () { noise(0.12, 0.22, 900, 120, 1); tone(120, 70, 0.12, 'sine', 0.22); },
    drop: function () { tone(420, 140, 0.28, 'sawtooth', 0.16); },
    pickup: function (n) { tone(700 * Math.pow(1.06, Math.min(18, n)), 0, 0.09, 'sine', 0.22); tone(1400, 0, 0.06, 'sine', 0.08); },
    stunt: function () { tone(500, 900, 0.18, 'square', 0.12); tone(750, 1350, 0.2, 'sine', 0.1); },
    hit: function () { noise(0.3, 0.4, 1200, 90, 1); tone(180, 60, 0.3, 'square', 0.2); },
    crash: function () { noise(0.9, 0.5, 2400, 60, 1); tone(220, 40, 0.7, 'sawtooth', 0.22); },
    tick: function () { noise(0.04, 0.1, 2600, 800, 1); },
    ui: function () { tone(880, 1320, 0.07, 'square', 0.14); },
    thunder: function () { noise(1.6, 0.35, 200, 40, 0.8); }
  };
})();

}

function decoY(lvl, x) {
  var period = 118 + lvl * 21;
  var t = ((x + lvl * 37) % period) / period;
  if (t < 0) t += 1;
  return LEVELS[lvl] + (2.2 + lvl * 0.5) * Math.sin(Math.PI * t);
}

function spanY(sp, x) {
  var len = Math.max(1, sp.x1 - sp.x0);
  var t = clamp((x - sp.x0) / len, 0, 1);
  var y = LEVELS[sp.lvl] + sp.sag * Math.sin(Math.PI * t);
  if (sp.ramp > 0 && x < sp.x0 + sp.ramp) y = lerp(sp.rampFrom, y, clamp((x - sp.x0) / sp.ramp, 0, 1));
  var d = Math.min(x - sp.x0, sp.x1 - x);
  if (d < 4) y -= (4 - d) * 0.4;
  return y;
}

var _sc = null;
function mainSpanAt(x) {
  if (_sc !== null && x >= _sc.x0 && x <= _sc.x1) return _sc;
  var s = world.spans;
  for (var i = Math.max(0, world.idx - 3); i < s.length; i++) {
    if (x < s[i].x0) return null;
    if (x <= s[i].x1) { _sc = s[i]; return s[i]; }
  }
  return null;
}

function inGap(x, lvl) {
  var gp = world.gaps;
  for (var i = Math.max(0, world.idx - 3); i < gp.length; i++) {
    if (x < gp[i].x0) return false;
    if (x < gp[i].x1 && gp[i].lvl === lvl) return true;
  }
  return false;
}

function wireAt(x, lvl) {
  var sp = mainSpanAt(x);
  if (sp && sp.lvl === lvl) return spanY(sp, x);
  if (inGap(x, lvl)) return null;
  return decoY(lvl, x);
}

function landingY(x, fromY, toY, minY, minLvl, upLvl, apexY) {
  var bestW = null, lo = Math.max(fromY, minY) - 0.5;
  if (minLvl === undefined) minLvl = 0;
  if (upLvl === undefined) upLvl = -1;
  for (var lvl = minLvl; lvl < LEVELS.length; lvl++) {
    var y = wireAt(x, lvl);
    if (y === null) continue;
    if (y >= lo && y <= toY + 0.5) {
      if (upLvl >= 0 && lvl < upLvl) {
        if (apexY === undefined || y - apexY < UP_CLEAR) continue;
      }
      if (!bestW || y < bestW.y) {
        var sp = mainSpanAt(x);
        bestW = { y: y, lvl: lvl, onMain: !!(sp && sp.lvl === lvl) };
      }
    }
  }
  return bestW;
}

function groundWire(x, onMain, lvl) {
  var sp = mainSpanAt(x);
  if (sp) {
    if (onMain || sp.lvl === lvl) return { y: spanY(sp, x), lvl: sp.lvl, onMain: true };
  }
  if (!onMain) {
    if (inGap(x, lvl)) return null;
    return { y: decoY(lvl, x), lvl: lvl, onMain: false };
  }
  return null;
}

function genSpan() {
  var w = world, rng = w.rng;
  var safe = w.safeCounter-- > 0;
  var prev = w.spans.length ? w.spans[w.spans.length - 1].lvl : w.level;
  if (!safe && w.spans.length > 0 && rng.chance(0.24)) w.level = clamp(w.level + (rng.chance(0.5) ? 1 : -1), 0, LEVELS.length - 1);
  var lvl = w.level;
  var len = rng.range(104, 172) * (city && city.def ? city.def.poleGap : 1);
  var x0 = w.nextX, x1 = x0 + len;
  var ramp = (lvl !== prev && !safe) ? rng.range(24, 34) : 0;
  var sag = rng.chance(0.35) ? rng.range(3.5, 7) : rng.range(1.2, 2.8);
  var gap = (!safe && !ramp && rng.chance(0.3) && x0 > 300) ? rng.range(18, 36) : 0;
  var sp = { x0: x0, x1: x1, lvl: lvl, sag: sag, ramp: ramp, rampFrom: LEVELS[prev], gap: gap, obs: null, picks: [], crow: null, shoes: null };
  var obsMin = Math.max(74, ramp + 104);
  if (!safe && !gap && len > obsMin + 46 && rng.chance(0.74)) {
    sp.obs = { t: rng.chance(0.58) ? 'branch' : 'drum', x: x0 + rng.range(obsMin, len - 32) };
  }
  if (rng.chance(0.8)) {
    var n = rng.int(2, 4);
    for (var i = 0; i < n; i++) {
      var px = x0 + 24 + (len - 48) * ((i + 0.5) / n) + rng.range(-6, 6);
      if (px < x0 + ramp + 18) continue;
      sp.picks.push({ x: px, y: LEVELS[lvl] - 12, got: false });
    }
  }
  if (gap) {
    for (var k = 0; k < 3; k++) sp.picks.push({ x: x1 + (gap + 10) * (k + 1) / 4, y: LEVELS[lvl] - 15 - Math.sin((k + 1) / 4 * Math.PI) * 12, got: false });
  }
  if (!safe && rng.chance(0.3)) sp.crow = { x: x0 + rng.range(26, len - 26), t: 0, fly: false, vx: 0, vy: 0 };
  if (rng.chance(0.22)) sp.shoes = x0 + rng.range(20, len - 20);
  w.spans.push(sp);
  w.poles.push(x1);
  if (gap) w.gaps.push({ x0: x1, x1: x1 + gap + 10, lvl: lvl });
  w.nextX = gap ? x1 + gap + 10 : x1;
}

function reset(longSafe, seed) {
  var rng = makeRng(seed === undefined ? runSeed : seed);
  world = { rng: rng, spans: [], poles: [], gaps: [], nextX: -420, level: 1, idx: 0, safeCounter: longSafe ? 99999 : 6 };
  while (world.nextX < 1000) genSpan();
  world.poles.unshift(world.spans[0].x0);
  player = {
    x: 0, y: 0, vy: 0, lvl: 1, onMain: true, state: 'run', animT: rng.next(),
    flipT: 0, jumpBuf: 0, coyote: COYOTE, minY: 1e9, landT: 0, deadT: 0,
    speed: SPEED0, stats: { jumps: 0, lands: 0, gapFalls: 0, drops: 0, stunts: 0, ups: 0, picks: 0, maxLvl: 2 }
  };
  player.y = wireAt(0, 1);
  cam = { x: player.x - PX, sway: 0, sy: 0 };
  T = 0; sparks = 0; stunts = 0; ups = 0; floats = []; parts = []; steamParts = []; crows = []; drops = [];
  cars = [];
  for (var i = 0; i < 7; i++) cars.push({ x: rng.range(-400, 900), lane: rng.chance(0.5) ? 0 : 1, v: rng.range(18, 46), col: rng.pick(['#ffd9a0', '#ff6a4a', '#8ff0ff']) });
  _sc = null;
  shakeT = 0; shakeA = 0; flashT = 0; overT = 0; deadMsg = ''; finalScore = null; newBest = false;
  poleScan = 0; nextTunnel = 2600 + rng.range(0, 1400); tunnelNow = null; boltT = 6 + rng.range(0, 10);
  rainOn = rng.chance(0.75); rainFade = rainOn ? 1 : 0;
  ai = { jumps: 0, drops: 0 };
}

function distM() { return Math.max(0, Math.floor(player.x / 10)); }
function totalScore() { return distM() + sparks * 10 + stunts * 25 + ups * 40; }

function burst(x, y, col, n, spd) {
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2, s = spd * (0.35 + Math.random() * 0.65);
    parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 20, life: 0.4 + Math.random() * 0.5, max: 0.9, col: col, size: Math.random() < 0.3 ? 2 : 1, grav: 220 });
  }
}
function dust(x, y) {
  for (var i = 0; i < 5; i++) parts.push({ x: x + (Math.random() * 8 - 4), y: y, vx: (Math.random() - 0.5) * 30, vy: -Math.random() * 22, life: 0.3 + Math.random() * 0.3, max: 0.6, col: '#cbbfae', size: 1, grav: -10 });
}
function addFloat(x, y, txt, col) { floats.push({ x: x, y: y, txt: txt, col: col || '#ffe9a8', t: 0, life: 1.1 }); }

var input = { jump: false, jumpHeld: false, down: false, downHeld: false };

function startGame() {
  audio.init(); audio.resume();
  runSeed = (Math.random() * 1e9) | 0;
  reset(false);
  state = 'play'; paused = false;
  audio.musicStart(); audio.setRumble(0.13);
  audio.ui();
}

function gameOver(kind) {
  if (state !== 'play') return;
  state = 'over'; overT = 0;
  player.state = 'dead'; player.deadT = 0;
  player.vy = kind === 'hit' ? -120 : 20;
  deadMsg = kind === 'hit' ? 'STUMBLED ON THE LINE' : 'FELL TO THE STREET';
  audio.crash();
  shakeT = 0.5; shakeA = 3.5; flashT = 0.22;
  burst(player.x, player.y - 10, kind === 'hit' ? '#ffd27a' : '#ff7a5a', 16, 90);
  saveWardrobe();
  finalScore = { dist: distM(), sparks: sparks, stunts: stunts, ups: ups, total: totalScore() };
  var b = loadBest();
  if (finalScore.total > b) { saveBest(finalScore.total); best = finalScore.total; newBest = true; }
  else { best = b; newBest = false; }
  audio.musicStop(); audio.setRumble(0.05);
}

function doJump() {
  var p = player;
  p.state = 'air'; p.vy = -JUMPV; p.flipT = 0; p.jumpBuf = 0; p.coyote = 0;
  p.startLvl = p.lvl; p.minY = 1e9;
  p.apexY = p.y; p.holdT = 0; p.highJump = false;
  p.stats.jumps++;
  audio.jump();
  burst(p.x - 3, p.y, '#cbbfae', 3, 40);
}

function doDrop() {
  var p = player;
  p.state = 'drop'; p.vy = DROP_VY; p.minY = p.y + 5; p.startLvl = p.lvl; p.stats.drops++;
  audio.drop();
}

function landOn(w, fromState) {
  var p = player;
  p.y = w.y; p.lvl = w.lvl; p.onMain = w.onMain;
  p.state = 'land'; p.landT = LAND_T; p.vy = 0; p.flipT = 0;
  if (w.lvl > p.stats.maxLvl) p.stats.maxLvl = w.lvl;
  p.stats.lands++;
  if (w.lvl < p.startLvl) {
    ups++; p.stats.ups++;
    addFloat(p.x, p.y - 34, 'UP +40', '#b6ff8f');
    audio.stunt();
    burst(p.x, p.y + 2, '#b6ff8f', 6, 40);
  } else if (w.lvl > p.startLvl) {
    stunts++;
    addFloat(p.x, p.y - 30, 'STUNT +25', '#8ff0ff');
    audio.stunt();
  } else if (fromState === 'fall') addFloat(p.x, p.y - 28, 'SAVED', '#9fffa8');
  else if (fromState === 'air' && p.airTime > 0.5) addFloat(p.x, p.y - 30, 'NICE', '#ffe9a8');
  audio.land(); dust(p.x, p.y + 1);
}

function updatePlayer(dt) {
  var p = player;
  p.animT += dt;
  if (p.jumpBuf > 0) p.jumpBuf -= dt;
  if (p.coyote > 0) p.coyote -= dt;
  p.speed = Math.min(SPEEDMAX, SPEED0 + T * ACCEL);
  p.x += p.speed * dt;

  if (p.state === 'run') {
    var gw = groundWire(p.x, p.onMain, p.lvl);
    if (gw === null) {
      p.state = 'fall'; p.vy = 24; p.minY = p.y + 5; p.startLvl = p.lvl; p.flipT = 0;
      p.stats.gapFalls++;
      addFloat(p.x, p.y - 26, 'GAP!', '#ff8a6a');
      audio.drop();
    } else {
      p.lvl = gw.lvl; p.onMain = gw.onMain;
      p.y = lerp(p.y, gw.y, 1 - Math.pow(0.000001, dt));
      p.coyote = COYOTE;
      if (p.jumpBuf > 0) doJump();
    }
  } else if (p.state === 'land') {
    p.landT -= dt;
    var gw2 = groundWire(p.x, p.onMain, p.lvl);
    if (gw2 !== null) { p.y = gw2.y; p.lvl = gw2.lvl; p.onMain = gw2.onMain; }
    if (p.landT <= 0) p.state = 'run';
    if (p.jumpBuf > 0 && (LAND_T - p.landT) > 0.08) doJump();
  } else if (p.state === 'air') {
    p.flipT += dt;
    if (input.jumpHeld && p.vy < 0) {
      p.holdT += dt;
      if (p.holdT >= UP_HOLD) p.highJump = true;
    }
    var gr = (input.jumpHeld && p.vy < 0) ? GRAV * HOLDG : GRAV;
    p.vy += gr * dt;
    var py = p.y;
    p.y += p.vy * dt;
    if (p.y < p.apexY) p.apexY = p.y;
    if (p.vy > 0) {
      var upLvl = p.highJump ? p.startLvl : -1;
      var minLvl = p.highJump ? p.startLvl - 1 : p.startLvl;
      var w1 = landingY(p.x, py, p.y, -1e9, minLvl, upLvl, p.apexY);
      if (w1) { p.airTime = p.flipT; landOn(w1, 'air'); }
    }
    if (p.y >= STREET_Y) { p.y = STREET_Y; gameOver('street'); }
  } else if (p.state === 'drop' || p.state === 'fall') {
    p.vy += GRAV * dt;
    var py2 = p.y;
    p.y += p.vy * dt;
    var w2 = landingY(p.x, py2, p.y, p.minY, p.startLvl + 1);
    if (w2) landOn(w2, p.state === 'fall' ? 'fall' : 'drop');
    else if (p.y >= STREET_Y) { p.y = STREET_Y; gameOver('street'); }
  } else if (p.state === 'dead') {
    p.deadT += dt;
    p.vy += 420 * dt;
    p.y += p.vy * dt;
    p.x += 26 * dt;
  }

  if (p.state !== 'dead') {
    var s = world.spans;
    for (var i = Math.max(0, world.idx - 2); i < s.length; i++) {
      if (s[i].x0 > p.x + 24) break;
      var o = s[i].obs;
      if (!o) continue;
      var oy = spanY(s[i], o.x), h = o.t === 'drum' ? 9 : 6;
      if (Math.abs(p.x - o.x) < 5 && p.y >= oy - h - 1 && p.y <= oy + 4) { gameOver('hit'); break; }
    }
  }
}

function updateWorld(dt) {
  while (world.nextX < cam.x + W * 3) genSpan();
  var s = world.spans;
  while (world.idx < s.length - 1 && player.x > s[world.idx].x1) world.idx++;
  while (s.length > 14 && s[0].x1 < player.x - 700) {
    s.shift(); world.poles.shift();
    if (world.idx > 0) world.idx--;
    if (poleScan > 0) poleScan--;
    if (_sc === null || _sc === undefined || !s.length || _sc.x1 < s[0].x0) _sc = null;
  }
  while (world.gaps.length && world.gaps[0].x1 < player.x - 700) world.gaps.shift();
  if (world.nextX > nextTunnel) {
    var len = world.rng.range(900, 1500);
    tunnelNow = { x0: world.nextX, x1: world.nextX + len };
    nextTunnel = world.nextX + len + world.rng.range(2800, 5200);
  }
  if (tunnelNow && player.x > tunnelNow.x1 + 60) tunnelNow = null;
  audio.setRumble(tunnelAmt() > 0.5 ? 0.32 : 0.13);
  if (tunnelAmt() < 0.5 && city.def.rain > 0) {
    boltT -= dt;
    if (boltT <= 0) {
      boltT = 9 + world.rng.range(0, 14);
      flashT = 0.3;
      audio.thunder();
    }
  }
  if (MODE === '' || TEST) { }
}

function updateEntities(dt) {
  var i, p = player;
  for (i = 0; i < world.spans.length; i++) {
    var sp = world.spans[i];
    if (sp.x1 < cam.x - 60) continue;
    if (sp.x0 > cam.x + W + 60) break;
    if (sp.crow) {
      var cr = sp.crow;
      var wy = spanY(sp, cr.x);
      if (!cr.fly && Math.abs(p.x - cr.x) < 58 && state === 'play') { cr.fly = true; cr.vx = -18 - Math.random() * 20; cr.vy = -52 - Math.random() * 22; audio.tick(); }
      if (cr.fly) {
        cr.t += dt;
        cr.x += cr.vx * dt; cr.y = (cr.y === undefined ? wy : cr.y) + cr.vy * dt;
        cr.vy += 26 * dt;
        if (cr.t > 1.6) sp.crow = null;
      } else cr.y = wy;
    }
    if (state === 'play') {
      for (var k = 0; k < sp.picks.length; k++) {
        var pk = sp.picks[k];
        if (pk.got) continue;
        if (Math.abs(pk.x - p.x) < 8 && Math.abs(pk.y - (p.y - 15)) < 17) {
          pk.got = true; sparks++; p.stats.picks++; sparkBank++; bankDirty = true;
          audio.pickup(sparks);
          burst(pk.x, pk.y, '#8ff0ff', 5, 45);
        }
      }
    }
  }
  if (Math.random() < dt * 1.6 && city.vents.length) {
    var v = city.vents[Math.floor(Math.random() * city.vents.length)];
    var tw = city.mid.width;
    var baseWorld = Math.floor((cam.x * 0.2 + v.x) / tw) * tw;
    var sx = baseWorld + v.x - cam.x * 0.2;
    if (sx > -20 && sx < W + 20) steamParts.push({ x: sx, y: v.y, vx: (Math.random() - 0.5) * 4, vy: -6 - Math.random() * 10, life: 2.6, max: 2.6, size: 2 + Math.random() * 3 });
  }
  for (i = steamParts.length - 1; i >= 0; i--) {
    var st = steamParts[i];
    st.life -= dt; st.x += st.vx * dt; st.y += st.vy * dt; st.vy *= 0.99;
    if (st.life <= 0) steamParts.splice(i, 1);
  }
  for (i = crows.length - 1; i >= 0; i--) {
    var cc = crows[i];
    cc.t += dt; cc.x += cc.vx * dt; cc.y += cc.vy * dt; cc.vy += 24 * dt;
    if (cc.t > 2) crows.splice(i, 1);
  }
  for (i = cars.length - 1; i >= 0; i--) {
    var car = cars[i];
    car.x += (p.speed * 0.62 + (car.lane === 0 ? -car.v : car.v)) * dt;
    if (car.x < cam.x * 0.62 - 200) car.x += 1500;
    if (car.x > cam.x * 0.62 + 900) car.x -= 1500;
  }
  var rTar = (rainOn && city.def.rain > 0) ? city.def.rain : 0;
  rainFade += (rTar - rainFade) * Math.min(1, dt * 0.4);
  if (rainFade > 0.02) {
    while (drops.length < 46 * rainFade) drops.push({ x: Math.random() * (W + 120), y: Math.random() * H, l: 4 + Math.random() * 8 });
    for (i = drops.length - 1; i >= 0; i--) {
      var d = drops[i];
      d.x -= (p.speed * 0.98 + 30) * dt;
      d.y += 150 * dt;
      if (d.x < -80 || d.y > H + 10) { d.x += W + 120 + Math.random() * 60; d.y = -20 - Math.random() * 60; }
    }
  }
  if (T > 22 && Math.random() < dt / 34) { rainOn = !rainOn; }
  for (i = parts.length - 1; i >= 0; i--) {
    var pt = parts[i];
    pt.life -= dt; pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vy += pt.grav * dt;
    if (pt.life <= 0) parts.splice(i, 1);
  }
  for (i = floats.length - 1; i >= 0; i--) {
    var fl = floats[i];
    fl.t += dt; fl.y -= 16 * dt;
    if (fl.t > fl.life) floats.splice(i, 1);
  }
  if (flashT > 0) flashT -= dt;
  if (shakeT > 0) shakeT -= dt;
  var pl = world.poles;
  while (poleScan < pl.length && player.x > pl[poleScan] + 2) {
    cam.sy += 0.7; audio.tick(); poleScan++;
  }
}

function updateCamera(dt) {
  var tx = player.x - PX;
  cam.x = lerp(cam.x, tx, 1 - Math.pow(0.0005, dt));
  if (state === 'over') cam.x = lerp(cam.x, tx - 30, 1 - Math.pow(0.02, dt));
  cam.sway = Math.sin(T * 1.15) * 1.5 + Math.sin(T * 0.47) * 0.8;
  cam.sy = cam.sy * 0.9 + (Math.sin(T * 1.9) * 0.6 + Math.sin(T * 0.31) * 0.5) * 0.1;
  if (shakeT > 0) {
    cam.sway += (Math.random() * 2 - 1) * shakeA;
    cam.sy += (Math.random() * 2 - 1) * shakeA;
  }
}

function stepSim(dt) {
  T += dt;
  if (state === 'play') {
    updateWorld(dt); updatePlayer(dt); updateEntities(dt);
  } else if (state === 'title') {
    var p = player;
    p.x += 40 * dt; p.animT += dt;
    var wy = wireAt(p.x, p.lvl);
    if (wy === null) { p.lvl = 1; wy = wireAt(p.x, p.lvl); }
    p.y = wy === null ? LEVELS[1] : wy;
    updateEntities(dt);
  } else if (state === 'over') {
    overT += dt;
    updatePlayer(dt); updateEntities(dt);
  }
  if (wardrobeMsgT > 0) wardrobeMsgT -= dt;
  if (bankDirty && T - lastBankSave > 0.5) { saveWardrobe(); lastBankSave = T; bankDirty = false; }
  updateCamera(dt);
  input.jump = false; input.down = false;
}

var errFlagged = false;
function frame(ts) {
  if (!last) last = ts;
  var dt = Math.min(0.06, (ts - last) / 1000);
  last = ts;
  acc += dt;
  var n = 0;
  while (acc >= STEP && n < 8) { if (!paused) stepSim(STEP); acc -= STEP; n++; }
  if (acc > STEP * 8) acc = 0;
  render();
  if (!errFlagged && (RUNTIME_ERRORS.length || ART_ERRORS.length)) {
    errFlagged = true;
    document.title = 'ERRORS ' + RUNTIME_ERRORS.concat(ART_ERRORS).join(' | ');
  }
  requestAnimationFrame(frame);
}

function drawPara(tile, para, y) {
  var tw = tile.width;
  var v = (cam.x * para + cam.sway * 0.6);
  var off = -((v % tw) + tw) % tw;
  for (var x = off - tw; x < W + tw; x += tw) g.drawImage(tile, Math.round(x), Math.round(y));
}

function drawWires() {
  var x0 = Math.floor(cam.x - 6), x1 = Math.ceil(cam.x + W + 6);
  var wc = (city && city.def && city.def.wire) ? city.def.wire : { main: '#333c58', mainHi: '#7d8cb5', deco: '#0d0c16', decoHi: '#2c3348' };
  var tag = 0, sp = mainSpanAt(cam.x + W * 0.5);
  if (sp) tag = sp.lvl;
  for (var lvl = 0; lvl < LEVELS.length; lvl++) {
    for (var x = x0; x <= x1; x++) {
      var y = wireAt(x, lvl);
      if (y === null) continue;
      var sx = Math.round(x - cam.x + cam.sway), sy = Math.round(y + cam.sy);
      if (sy < -4 || sy > H + 4) continue;
      var isMain = false;
      var msp = mainSpanAt(x);
      if (msp && msp.lvl === lvl) isMain = true;
      if (isMain) {
        g.fillStyle = wc.main;
        g.fillRect(sx, sy, 1, 1);
        if ((x & 7) === 0) { g.fillStyle = wc.mainHi; g.fillRect(sx, sy - 1, 1, 1); }
      } else {
        g.fillStyle = wc.deco;
        g.fillRect(sx, sy, 1, 1);
        if ((x % 22) === 0) { g.fillStyle = wc.decoHi; g.fillRect(sx, sy - 1, 1, 1); }
      }
    }
  }
  for (var i = 0; i < world.gaps.length; i++) {
    var gp = world.gaps[i];
    for (var s = 0; s < 2; s++) {
      var gx = s === 0 ? gp.x0 - 1 : gp.x1 + 1;
      var gy = LEVELS[gp.lvl] + (s === 0 ? -1 : 0);
      var sx2 = Math.round(gx - cam.x + cam.sway), sy2 = Math.round(gy + cam.sy);
      for (var k = 0; k < 6; k++) {
        g.fillStyle = k < 3 ? wc.main : wc.deco;
        g.fillRect(sx2 + (s === 0 ? -k : k) * 0.4, sy2 + k, 1, 1);
      }
    }
  }
}

function drawPicks() {

function drawRain() {

function tunnelAmt() {
  if (!tunnelNow) return 0;
  var a = clamp((player.x - tunnelNow.x0 + 70) / 150, 0, 1) * clamp((tunnelNow.x1 + 40 - player.x) / 150, 0, 1);
  return Math.max(0, a);
}

    g.fillRect(22, ty - 3, 200, 15);
    g.globalAlpha = 1;
    drawText(g, (k + 4) + ' ' + th.name, 27, ty, sel ? '#ffffff' : '#cfe0f0', 1);
    drawText(g, sel ? 'SELECTED' : 'PRESS ' + (k + 4), 160, ty, sel ? '#9fffa8' : '#8f86a8', 1);
  }

  /* live previews */
  drawText(g, 'PREVIEW', 236, 30, '#9fb6d8', 1);
  var box = getThemePreview(scenery);
  g.drawImage(box, 236, 40);
  rect(g, 236, 40, 96, 1, '#0b0816');
  rect(g, 236, 93, 96, 1, '#0b0816');
  rect(g, 236, 40, 1, 54, '#0b0816');
  rect(g, 331, 40, 1, 54, '#0b0816');
  drawText(g, scenery.toUpperCase().slice(0, 15), 236, 98, '#cfe0f0', 1);
  drawText(g, OUTFITS[equippedOutfit].name, 236, 180, '#cfe0f0', 1);
  var f = Math.floor(T * 12) % 8;
  var spr = art.run[f];
  var px = 258, py = 174;
  g.fillStyle = '#12101c';
  g.fillRect(236, 106, 96, 70);
  g.drawImage(spr.c, px, py - (spr.h - 1) * 2, spr.w * 2, spr.h * 2);
  drawCane(px + 9 * 2 + 6, py - (spr.h - 1) * 2 + 32, 0.42, 1);
  rect(g, 236, 106, 96, 1, '#2a2438');

  drawTextCenter(g, '1-3 OUTFIT   4-6 BACKGROUND   C CLOSE', W / 2, 194, '#8f86a8', 1);
}

function drawOver() {
  var a = clamp((overT - 0.45) * 1.4, 0, 1);
  if (a <= 0) return;
  g.globalAlpha = a * 0.72;
  g.fillStyle = '#07050c';
  g.fillRect(WIN_L, WIN_T, W - WIN_L - WIN_R, H - WIN_T - WIN_B);
  g.globalAlpha = a;
  drawTextCenterOutline(g, 'GAME OVER', W / 2, 58, '#ff6a6a', '#140d18', 4);
  drawTextCenter(g, deadMsg, W / 2, 88, '#e6d8c2', 1);
  drawTextCenter(g, 'DISTANCE ' + finalScore.dist + ' M', W / 2, 106, '#f2e8d4', 2);
  drawTextCenter(g, 'SPARKS X' + finalScore.sparks + '  STUNTS X' + finalScore.stunts + '  UPS X' + finalScore.ups, W / 2, 126, '#8ff0ff', 1);
  drawTextCenter(g, 'TOTAL ' + finalScore.total, W / 2, 136, '#ffd27a', 1);
  if (newBest) drawTextCenter(g, 'NEW BEST!', W / 2, 146, '#9fffa8', 1);
  else drawTextCenter(g, 'BEST ' + best, W / 2, 146, '#c8b9a6', 1);
  if (overT > 0.9 && Math.floor(T * 2) % 2) drawTextCenter(g, 'PRESS SPACE TO RIDE AGAIN', W / 2, 166, '#ffe9a8', 1);
  g.globalAlpha = 1;
}

function drawPause() {
  g.globalAlpha = 0.5;
  g.fillStyle = '#07050c';
  g.fillRect(WIN_L, WIN_T, W - WIN_L - WIN_R, H - WIN_T - WIN_B);
  g.globalAlpha = 1;
  drawTextCenterOutline(g, 'PAUSED', W / 2, 96, '#f2e8d4', '#140d18', 3);
  drawTextCenter(g, 'ESC TO RESUME    C CUSTOMISE', W / 2, 126, '#b9a7c4', 1);
}

function drawErrors() {
  var errs = RUNTIME_ERRORS.concat(ART_ERRORS);
  if (!errs.length) return;
  g.globalAlpha = 0.8;
  g.fillStyle = '#3a0000';
  g.fillRect(0, 0, W, 12 + errs.length * 8);
  g.globalAlpha = 1;
  drawText(g, 'ERRORS ' + errs.length, 2, 2, '#ff8a8a', 1);
  for (var i = 0; i < Math.min(4, errs.length); i++) drawText(g, errs[i].slice(0, 60), 2, 10 + i * 8, '#ffb0b0', 1);
}

function compositeScene() {
  g = sceneG;
  sceneG.clearRect(0, 0, SW, SH);
  sceneG.drawImage(cabinC, 0, 0);
  sceneG.drawImage(viewC, VOX, VOY);
  sceneG.drawImage(sashC, 0, 0);
  g = viewG;
}

function render() {
  g.clearRect(0, 0, W, H);
  var tunA = tunnelAmt();
  if (tunA > 0.01) drawTunnelBack(tunA);
  else {
    g.drawImage(city.sky, Math.round(cam.sway * 0.3), 0);
    drawPara(city.far, 0.08, cam.sy * 0.4);
    drawPara(city.mid, 0.2, cam.sy * 0.7);
    drawStreet();
    drawPara(city.near, 1.45, cam.sy);
    drawMist();
  }
  for (var i = 0; i < steamParts.length; i++) {
    var st = steamParts[i];
    g.globalAlpha = clamp(st.life / st.max, 0, 1) * 0.14;
    g.fillStyle = '#cfd8e8';
    g.fillRect(Math.round(st.x), Math.round(st.y), Math.round(st.size), Math.round(st.size));
    g.globalAlpha = 1;
  }
  drawWires();
  drawPoles();
  drawObstacles();
  drawPicks();
  drawPlayer();
  for (var p2 = 0; p2 < parts.length; p2++) {
    var pt = parts[p2];
    g.globalAlpha = clamp(pt.life / pt.max, 0, 1);
    g.fillStyle = pt.col;
    g.fillRect(Math.round(pt.x - cam.x + cam.sway), Math.round(pt.y + cam.sy), pt.size, pt.size);
    g.globalAlpha = 1;
  }
  drawRain();
  if (tunA > 0.01) drawTunnelFront(tunA);
  drawAtmosphere();
  drawGlassDyn();
  g.drawImage(glassC, 0, 0);
  drawHUD();
  if (state === 'title') drawTitle();
  if (state === 'over') drawOver();
  if (paused) drawPause();
  drawErrors();
  if (ZOOM > 1) g.drawImage(viewC, ZOX - W / (2 * ZOOM), ZOY - H / (2 * ZOOM), W / ZOOM, H / ZOOM, 0, 0, W, H);
  compositeScene();
}

function scriptedInput() {
  var p = player;
  input.jumpHeld = (p.state === 'air' && p.flipT < 0.16) || (ai.holdUntil !== undefined && T < ai.holdUntil);
  if (p.state !== 'run' && p.state !== 'land') return;
  var lvl = p.lvl;
  for (var i = 0; i < world.gaps.length; i++) {
    var gp = world.gaps[i];
    if (gp.lvl === lvl) {
      var d = gp.x0 - p.x;
      if (d > p.speed * 0.02 && d < p.speed * 0.12) { input.jump = true; input.jumpHeld = true; p.jumpBuf = JBUF; ai.jumps++; return; }
    }
  }
  var s = world.spans;
  for (var j = Math.max(0, world.idx - 1); j < s.length; j++) {
    var sp = s[j];
    if (sp.x0 > p.x + 120) break;
    if (sp.lvl === lvl && sp.obs && p.x > sp.x0 + sp.ramp + 4) {
      var d2 = sp.obs.x - p.x;
      if (d2 > p.speed * 0.16 && d2 < p.speed * 0.4) { input.jump = true; input.jumpHeld = true; p.jumpBuf = JBUF; ai.jumps++; return; }
    }
  }
}

function simulate(secs, opt) {
  opt = opt || {};
  var t = 0, maxN = Math.ceil(secs / STEP);
  for (var n = 0; n < maxN; n++) {
    if (state === 'play') scriptedInput();
    if (opt.onStep) opt.onStep(t);
    stepSim(STEP);
    t += STEP;
    if (opt.stopWhen && opt.stopWhen(t)) break;
  }
  return t;
}

function drawTestReport(info) {
  g.globalAlpha = 0.88;
  g.fillStyle = '#080611';
  g.fillRect(0, 0, W, H);
  g.globalAlpha = 1;
  var errs = RUNTIME_ERRORS.concat(ART_ERRORS);
  var ok = errs.length === 0 && info.lands > 4 && info.jumps > 4 && info.upOK > 0;
  drawText(g, 'LINE JUMPER - SELF TEST', 8, 8, '#f2e8d4', 1);
  drawText(g, ok ? 'STATUS: PASS' : 'STATUS: CHECK', 8, 20, ok ? '#9fffa8' : '#ffb0b0', 2);
  var lines = [
    'TOTAL SIM     ' + info.t.toFixed(0) + ' S   ' + info.dist + ' M',
    'RUNNER STATE  ' + info.state,
    'JUMPS/ISSUED  ' + info.jumps + '/' + info.jumpsIssued,
    'LANDINGS      ' + info.lands,
    'GAP FALLS     ' + info.gapFalls,
    'DROPS TRIED   ' + info.drops,
    'UP JUMPS OK   ' + info.upOK + '/' + info.upTry,
    'STUNTS/UPS    ' + info.stunts + '/' + info.ups,
    'SPARKS        ' + info.picks,
    'MAX LEVEL     ' + info.maxLvl,
    'PHASE1        ' + info.deaths,
    'STREET DEATHS ' + info.street,
    'SCORE         ' + info.score,
    'SCENERY       ' + city.def.name,
    'RUNTIME ERRS  ' + RUNTIME_ERRORS.length,
    'ART ERRS      ' + ART_ERRORS.length
  ];
  for (var i = 0; i < lines.length; i++) drawText(g, lines[i], 8, 42 + i * 9, '#cfe0f0', 1);
  for (var e = 0; e < Math.min(5, errs.length); e++) drawText(g, errs[e].slice(0, 58), 8, 42 + (lines.length + e) * 9, '#ff8a8a', 1);
  drawText(g, 'PRESS SPACE OR TAP TO PLAY', W / 2 - 78, H - 14, '#ffe9a8', 1);
}

function runSelfTest() {
  reset(false); state = 'play';
  var p1 = simulate(45);
  var r1 = {
    dist: distM(), jumps: player.stats.jumps, lands: player.stats.lands, gaps: player.stats.gapFalls,
    picks: player.stats.picks, st: state, deaths: (state !== 'play' ? 1 : 0)
  };
  if (state !== 'play') { reset(false); state = 'play'; }
  var attempted = 0, landed = 0, deaths = 0, lastDrop = -99;
  simulate(30, {
    onStep: function (t) {
      if (t - lastDrop > 7 && player.state === 'run' && player.lvl < LEVELS.length - 1) {
        lastDrop = t; attempted++;
        var from = player.lvl;
        doDrop();
        if (player.startLvl === from) { }
      }
    }
  });
  var dropsNow = player.stats.drops;
  reset(false); state = 'play';
  var upTry = 0, upOK = 0, pendingFrom = -1, lastUpT = -99, prevSt = player.state;
  simulate(40, {
    onStep: function (t) {
      var p = player;
      if (pendingFrom >= 0 && prevSt !== 'land' && p.state === 'land') {
        if (p.lvl < pendingFrom) upOK++;
        pendingFrom = -1;
      }
      prevSt = p.state;
      if (p.state === 'run' && t - lastUpT > 4.5) {
        var clear = true, i;
        for (i = 0; i < world.gaps.length; i++) {
          var d = world.gaps[i].x0 - p.x;
          if (d > 0 && d < 170) clear = false;
        }
        var sp = mainSpanAt(p.x);
        if (sp && sp.obs && sp.obs.x - p.x > -20 && sp.obs.x - p.x < 170) clear = false;
        if (sp && p.x < sp.x0 + sp.ramp + 30) clear = false;
        if (clear && p.lvl > 0) {
          lastUpT = t; pendingFrom = p.lvl; upTry++;
          p.jumpBuf = JBUF;
          ai.holdUntil = T + 0.42;
        }
      }
    }
  });
  var upsNow = player.stats.ups;
  render();
  var errs = RUNTIME_ERRORS.length + ART_ERRORS.length;
  drawTestReport({
    t: p1 + 70, state: state, dist: distM(), score: totalScore(),
    jumps: r1.jumps, jumpsIssued: ai.jumps, lands: r1.lands, gapFalls: r1.gaps,
    drops: dropsNow, stunts: stunts, ups: upsNow, picks: r1.picks, maxLvl: player.stats.maxLvl,
    street: (state === 'over' && deadMsg.indexOf('STREET') >= 0) ? 1 : 0,
    deaths: 'P1 ' + r1.dist + 'M  DROPS ' + attempted,
    upTry: upTry, upOK: upOK, errs: errs
  });
  compositeScene();
  document.title = errs === 0 ? 'TEST PASS' : 'TEST ERRORS ' + errs;
}

function runShot() {
  var pose = qs.get('pose') || 'run';
  var secs = parseFloat(qs.get('shot') || '4');
  if (pose === 'pause') {
    reset(false); state = 'play';
    simulate(secs);
    paused = true;
    render();
    paused = false;
    return;
  }
  if (pose === 'title') {
    reset(true); state = 'title';
    simulate(secs);
  } else {
    reset(false); state = 'play';
    if (qs.get('tun')) tunnelNow = { x0: 320, x1: 2600 };
    if (pose === 'air') simulate(secs, { stopWhen: function () { return player.state === 'air' && player.flipT > 0.26; } });
    else if (pose === 'drop') simulate(secs, { stopWhen: function () { return player.state === 'drop' && player.vy > 18; } });
    else if (pose === 'fall') simulate(secs, { stopWhen: function () { return player.state === 'fall' && player.vy > 10; } });
    else if (pose === 'over') { simulate(secs); if (state === 'play') gameOver('street'); simulate(1.6); }
    else if (pose === 'land') simulate(secs, { stopWhen: function () { return player.state === 'land'; } });
    else if (pose === 'up') {
      var launched = false, done = false;
      simulate(secs, {
        onStep: function () {
          if (done) return;
          if (!launched && player.state === 'run' && player.lvl > 0) {
            var clear = true, i;
            for (i = 0; i < world.gaps.length; i++) { var d = world.gaps[i].x0 - player.x; if (d > 0 && d < 200) clear = false; }
            var sp = mainSpanAt(player.x);
            if (sp && sp.obs && sp.obs.x - player.x > -40 && sp.obs.x - player.x < 200) clear = false;
            if (clear && player.x > 200) {
              launched = true; player.jumpBuf = JBUF; ai.holdUntil = T + 0.42;
            }
          } else if (launched && player.state === 'land') {
            done = true;
          }
        },
        stopWhen: function () { return done; }
      });
      simulate(0.3);
    }
    else simulate(secs);
  }
  render();
  document.title = 'SHOT ' + pose + ' ' + secs + (RUNTIME_ERRORS.length || ART_ERRORS.length ? ' ERRS ' + (RUNTIME_ERRORS.length + ART_ERRORS.length) : ' OK');
}

function drawAudioReport(lines) {
  g.globalAlpha = 0.9;
  g.fillStyle = '#080611';
  g.fillRect(0, 0, W, H);
  g.globalAlpha = 1;
  drawText(g, 'AUDIO CHECK', 8, 8, '#ffe9a8', 2);
  for (var i = 0; i < lines.length; i++) drawText(g, lines[i].slice(0, 62), 8, 32 + i * 10, '#cfe0f0', 1);
  drawText(g, 'SFX CTX ' + (audio.ok() ? 'READY' : 'UNAVAILABLE'), 8, 32 + lines.length * 10 + 8, '#9fffa8', 1);
}

function runAudioCheck() {
  reset(false);
  state = 'play';
  audio.init();
  audio.resume();
  audio.musicStart();
  var l0 = 't0  ' + audio.bgmDebug();
  setTimeout(function () {
    var l1 = 't1  ' + audio.bgmDebug();
    audio.musicPause();
    var l2 = 'pause ' + audio.bgmDebug();
    audio.musicPlay();
    var l3 = 'resume ' + audio.bgmDebug();
    audio.musicStop();
    var l4 = 'stop ' + audio.bgmDebug();
    render();
    drawAudioReport([l0, l1, l2, l3, l4]);
    compositeScene();
    document.title = 'AUDIO CHECK';
  }, 1800);
}

function onKey(e, down) {
  var code = e.code;
  if (code === 'Space' || code === 'ArrowUp' || code === 'KeyW' || code === 'KeyZ') {
    e.preventDefault();
    if (down) {
      input.jump = true; input.jumpHeld = true;
      if (state === 'title') startGame();
      else if (state === 'over' && overT > 0.6) startGame();
      else if (state === 'play') player.jumpBuf = JBUF;
    } else input.jumpHeld = false;
    return;
  }
  if (code === 'ArrowDown' || code === 'KeyS') {
    e.preventDefault();
    if (down) {
      input.down = true;
      if (state === 'play' && (player.state === 'run' || player.state === 'land')) doDrop();
      else if (state === 'play' && player.state === 'air' && player.vy > -30) player.vy += 90;
    } else input.downHeld = false;
    return;
  }
  if (!down) return;
  if (wardrobe && (state === 'title' || paused)) {
    if (code === 'Digit1') { equipOutfit(OUTFIT_IDS[0]); return; }
    if (code === 'Digit2') { equipOutfit(OUTFIT_IDS[1]); return; }
    if (code === 'Digit3') { equipOutfit(OUTFIT_IDS[2]); return; }
    if (code === 'Digit4') { setScenery(THEME_IDS[0]); return; }
    if (code === 'Digit5') { setScenery(THEME_IDS[1]); return; }
    if (code === 'Digit6') { setScenery(THEME_IDS[2]); return; }
    if (code === 'KeyC' || code === 'Escape') { wardrobe = false; audio.ui(); return; }
    return;
  }
  if (code === 'KeyM') { audio.init(); audio.toggleMute(); }
  if (code === 'KeyV' && state === 'title') {
    var idx = THEME_IDS.indexOf(scenery);
    setScenery(THEME_IDS[(idx + 1) % THEME_IDS.length]);
    return;
  }
  if (code === 'KeyC' && (state === 'title' || paused)) { wardrobe = !wardrobe; audio.ui(); return; }
  if (code === 'KeyR') startGame();
  if (code === 'Escape' || code === 'KeyP') {
    if (state === 'play') {
      paused = !paused;
      if (paused) audio.musicPause(); else audio.musicPlay();
    }
  }
}
document.addEventListener('keydown', function (e) { if (e.repeat) { if (e.code === 'Space' || e.code.indexOf('Arrow') === 0) e.preventDefault(); return; } onKey(e, true); });
document.addEventListener('keyup', function (e) { onKey(e, false); });
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  audio.init(); audio.resume();
  if (state === 'title' || (state === 'over' && overT > 0.6)) { startGame(); return; }
  var r = cv.getBoundingClientRect();
  var y = (((e.clientY - r.top) / r.height) * SH - VOY) / H;
  if (y < 0.62) { input.jump = true; input.jumpHeld = true; if (state === 'play') player.jumpBuf = JBUF; }
  else { input.down = true; if (state === 'play' && (player.state === 'run' || player.state === 'land')) doDrop(); }
});
cv.addEventListener('pointerup', function () { input.jumpHeld = false; });
document.addEventListener('visibilitychange', function () { if (document.hidden && state === 'play') { paused = true; audio.musicPause(); } });
window.addEventListener('blur', function () { if (state === 'play') { paused = true; audio.musicPause(); } });

best = loadBest();
if (MODE === 'audio') {
  runAudioCheck();
} else if (MODE === 'sheet') {
  reset(false);
  runSheet();
  document.title = 'SHEET';
} else if (qs.get('play')) {
  reset(false);
  state = 'play';
  if (qs.get('tun')) tunnelNow = { x0: 320, x1: 2200 };
  requestAnimationFrame(frame);
} else if (MODE === 'shot') {
  runShot();
} else if (MODE === 'test') {
  runSelfTest();
} else {
  reset(false);
  state = 'title';
  requestAnimationFrame(frame);
}
</script>
