  RUNTIME_ERRORS.push(String(msg) + ' @' + line + ':' + col);

var W = 384, H = 216;

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function makeRng(seed) {
  var r = mulberry32(seed >>> 0);
  return {
    next: r,
    range: function (a, b) { return a + r() * (b - a); },
    int: function (a, b) { return Math.floor(a + r() * (b - a + 1)); },
    pick: function (arr) { return arr[Math.floor(r() * arr.length)]; },
    chance: function (p) { return r() < p; }
  };
}

function newCanvas(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function ctxOf(c) { var x = c.getContext('2d'); x.imageSmoothingEnabled = false; return x; }

function rect(g, x, y, w, h, col) {
  g.fillStyle = col;
  g.fillRect(Math.round(x), Math.round(y), Math.max(1, Math.round(w)), Math.max(1, Math.round(h)));
}
function pixel(g, x, y, col) { g.fillStyle = col; g.fillRect(x | 0, y | 0, 1, 1); }

function roundRectPath(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.lineTo(x + w - r, y);
  g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r);
  g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  g.lineTo(x + r, y + h);
  g.quadraticCurveTo(x, y + h, x, y + h - r);
  g.lineTo(x, y + r);
  g.quadraticCurveTo(x, y, x + r, y);
  g.closePath();
}

function lerpColor(a, b, t) {
  function hex(c) { return [parseInt(c.substr(1, 2), 16), parseInt(c.substr(3, 2), 16), parseInt(c.substr(5, 2), 16)]; }
  var A = hex(a), B = hex(b);
  return 'rgb(' + Math.round(lerp(A[0], B[0], t)) + ',' + Math.round(lerp(A[1], B[1], t)) + ',' + Math.round(lerp(A[2], B[2], t)) + ')';
}

function glyphW(ch) { var gl = FONT[ch]; return gl ? gl[0].length : 4; }

function textW(str, scale, spacing) {
  scale = scale || 1; spacing = spacing === undefined ? 1 : spacing;
  var w = 0;
  for (var i = 0; i < str.length; i++) w += glyphW(str[i]) * scale + spacing * scale;
  return w - spacing * scale;
}

function drawText(g, str, x, y, col, scale, spacing) {
  scale = scale || 1; spacing = spacing === undefined ? 1 : spacing;
  str = String(str).toUpperCase();
  var cx = x;
  g.fillStyle = col;
  for (var i = 0; i < str.length; i++) {
    var gl = FONT[str[i]];
    if (gl) {
      for (var ry = 0; ry < gl.length; ry++) {
        var row = gl[ry];
        for (var rx = 0; rx < row.length; rx++) {
          if (row[rx] !== '.' && row[rx] !== ' ') g.fillRect(cx + rx * scale, y + ry * scale, scale, scale);
        }
      }
      cx += (glyphW(str[i]) + spacing) * scale;
    } else cx += 4 * scale;
  }
  return cx;
}

function drawTextOutline(g, str, x, y, col, outline, scale, spacing) {
  spacing = spacing === undefined ? 1 : spacing;
  for (var dx = -1; dx <= 1; dx++)
    for (var dy = -1; dy <= 1; dy++)
      if (dx || dy) drawText(g, str, x + dx * scale, y + dy * scale, outline, scale, spacing);
  drawText(g, str, x, y, col, scale, spacing);
}

function drawTextCenter(g, str, cx, y, col, scale, spacing) {
  drawText(g, str, cx - textW(str, scale, spacing) / 2, y, col, scale, spacing);
}

function drawTextCenterOutline(g, str, cx, y, col, outline, scale, spacing) {
  drawTextOutline(g, str, cx - textW(str, scale, spacing) / 2, y, col, outline, scale, spacing);
}

function compile(rows, pal) {
  var w = 0, h = rows.length, i;
  for (i = 0; i < h; i++) if (rows[i].length > w) w = rows[i].length;
  var c = newCanvas(w, h), g = ctxOf(c);
  for (var y = 0; y < h; y++) {
    var row = rows[y];
    for (var x = 0; x < row.length; x++) {
      var col = pal[row[x]];
      if (col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); }
    }
  }
  return { c: c, w: w, h: h };
}

function blit(g, s, x, y, flip, alpha) {
  x = Math.round(x); y = Math.round(y);
  var a = alpha === undefined ? 1 : alpha;
  if (a !== 1) g.globalAlpha = a;
  if (flip) {
    g.save(); g.translate(x + s.w, y); g.scale(-1, 1); g.drawImage(s.c, 0, 0); g.restore();
  } else g.drawImage(s.c, x, y);
  if (a !== 1) g.globalAlpha = 1;
}

function rotateSprite(s, deg, pad) {
  var d = Math.ceil(Math.sqrt(s.w * s.w + s.h * s.h)) + (pad === undefined ? 2 : pad);
  var c = newCanvas(d, d), g = ctxOf(c);
  g.translate(d / 2, d / 2);
  g.rotate(deg * Math.PI / 180);
  g.drawImage(s.c, -Math.round(s.w / 2), -Math.round(s.h / 2));
  return { c: c, w: d, h: d };
}

function buildArt() {
  var art = {};
  art.run = [compile(RUN0, PP), compile(RUN1, PP), compile(RUN2, PP), compile(RUN3, PP)];
  art.tuck = [];
  for (var i = 0; i < 12; i++) art.tuck.push(rotateSprite(compile(TUCK, PP), i * 30));
  art.fall = [compile(FALL0, PP), compile(FALL1, PP)];
  art.land = compile(LAND, PP);
  art.branch = compile([
    '..K....KK.',
    '.KbK..KbK.',
    'KbbK.KbK..',
    '.KbKKbbK..',
    '..KbbbbK..',
    '...KKKK...'

  return art;
}

var SKY_STOPS = [
  [0.00, '#0a0817'], [0.30, '#191130'], [0.50, '#2b1640'], [0.62, '#4b2044'],
  [0.72, '#7a3543'], [0.80, '#a95243'], [0.855, '#cf7a4c'], [0.90, '#7c4038'],
  [0.95, '#33202e'], [1.00, '#161020']
];

function skyColorAt(t) {
  for (var i = 0; i < SKY_STOPS.length - 1; i++) {
    var a = SKY_STOPS[i], b = SKY_STOPS[i + 1];
    if (t >= a[0] && t <= b[0]) return lerpColor(a[1], b[1], (t - a[0]) / (b[0] - a[0]));
  }
  return SKY_STOPS[SKY_STOPS.length - 1][1];
}

function buildSky(rng) {
  var c = newCanvas(W, H), g = ctxOf(c);
  for (var y = 0; y < H; y++) {
    g.fillStyle = skyColorAt(y / H);
    g.fillRect(0, y, W, 1);
  }
  for (var y2 = 0; y2 < H; y2 += 8) {
    var col = skyColorAt(y2 / H);
    g.fillStyle = col;
    g.globalAlpha = 0.5;
    for (var x = 0; x < W; x++) if ((x + y2) % 2 === 0) g.fillRect(x, y2, 1, 1);
    g.globalAlpha = 1;
  }
  for (var st = 0; st < 46; st++) {
    var sx2 = rng.int(0, W), sy2 = rng.int(4, 108);
    g.globalAlpha = 0.18 + rng.next() * 0.5;
    g.fillStyle = rng.chance(0.7) ? '#dfe4ff' : '#ffd9c0';
    g.fillRect(sx2, sy2, 1, 1);
    g.globalAlpha = 1;
  }
  var mx = 306, my = 52;
  for (var mi = 4; mi >= 1; mi--) {
    g.globalAlpha = 0.035 * mi;
    g.fillStyle = '#cfd8f0';
    g.beginPath(); g.arc(mx, my, 9 + mi * 4, 0, 7); g.fill();
  }
  g.globalAlpha = 1;
  g.fillStyle = '#d8d3c4';
  g.beginPath(); g.arc(mx, my, 10, 0, 7); g.fill();
  g.fillStyle = '#efe9da';
  g.beginPath(); g.arc(mx - 1, my - 1, 9, 0, 7); g.fill();
  g.fillStyle = '#c9c2b0';
  g.fillRect(mx - 5, my - 3, 3, 2);
  g.fillRect(mx + 1, my + 2, 4, 3);
  g.fillRect(mx - 2, my + 5, 3, 2);
  g.fillRect(mx + 4, my - 4, 2, 2);
  g.globalAlpha = 0.35;
  g.fillStyle = '#2a1a38';
  g.fillRect(mx - 12, my + 5, 26, 2);
  g.fillRect(mx - 4, my - 9, 20, 1);
  g.globalAlpha = 1;
  var sunX = 92, sunY = 152;
  for (var i = 3; i >= 1; i--) {
    g.globalAlpha = 0.045 * i;
    g.fillStyle = '#ff9a5c';
    g.beginPath(); g.arc(sunX, sunY, 13 * (0.55 + i * 0.35), 0, 7); g.fill();
  }
  g.globalAlpha = 1;
  g.fillStyle = '#e8a062';
  g.beginPath(); g.arc(sunX, sunY, 13, 0, 7); g.fill();
  g.fillStyle = '#f2bb84';
  g.beginPath(); g.arc(sunX, sunY, 9, 0, 7); g.fill();
  for (var s = 0; s < 6; s++) {
    var cy = rng.int(36, 132), cx = rng.int(0, W), cw = rng.int(40, 130);
    g.globalAlpha = 0.16;
    g.fillStyle = rng.chance(0.5) ? '#241636' : '#3a1e42';
    g.fillRect(cx, cy, cw, 2);
    g.fillRect(cx + rng.int(0, 20), cy + 2, Math.max(4, cw - 12), 1);
    g.globalAlpha = 1;
  }
  return c;
}

function buildFar(rng) {
  var TW = 1536, c = newCanvas(TW, H), g = ctxOf(c);
  var x = 0;
  while (x < TW) {
    var bw = rng.int(24, 62), bh = rng.int(16, 56);
    var top = 168 - bh;
    var base = rng.pick(['#1c1429', '#211734', '#181125', '#241a37', '#1e1630']);
    var grd = g.createLinearGradient(0, top, 0, 171);
    grd.addColorStop(0, base);
    grd.addColorStop(1, lerpColor(base, '#312044', 0.4));
    g.fillStyle = grd;
    g.fillRect(x, top, bw, bh);
    g.fillStyle = lerpColor(base, '#5c4270', 0.45);
    g.fillRect(x, top, bw, 1);
    for (var gy = top + 4; gy < 164; gy += 6) {
      for (var gx = x + 3; gx < x + bw - 2; gx += 5) {
        if (rng.chance(0.14)) {
          g.globalAlpha = 0.3 + rng.next() * 0.45;
          g.fillStyle = rng.chance(0.72) ? '#ffce8c' : '#8fe0f0';
          g.fillRect(gx, gy, 1, 2);
          g.globalAlpha = 1;
        }
      }
    }
    if (rng.chance(0.45)) {
      var tw = rng.int(4, 7);
      var tx = x + rng.int(1, Math.max(1, bw - tw - 1));
      g.fillStyle = base; g.fillRect(tx, top - 7, tw, 5);
      g.fillStyle = '#160f22'; g.fillRect(tx, top - 3, tw, 3);
    }
    if (rng.chance(0.55)) {
      var ax = x + rng.int(2, Math.max(2, bw - 3)), ah = rng.int(6, 20);

    fl.t += dt; fl.y -= 16 * dt;
    if (fl.t > fl.life) floats.splice(i, 1);
  }
  if (flashT > 0) flashT -= dt;
  if (shakeT > 0) shakeT -= dt;
  var pl = world.poles;
  while (poleScan < pl.length && player.x > pl[poleScan] + 2) {
    cam.sy += 0.7; audio.tick(); poleScan++;
  }
}

function updateCamera(dt) {
  var tx = player.x - PX;
  cam.x = lerp(cam.x, tx, 1 - Math.pow(0.0005, dt));
  if (state === 'over') cam.x = lerp(cam.x, tx - 30, 1 - Math.pow(0.02, dt));
  cam.sway = Math.sin(T * 1.15) * 1.5 + Math.sin(T * 0.47) * 0.8;
  cam.sy = cam.sy * 0.9 + (Math.sin(T * 1.9) * 0.6 + Math.sin(T * 0.31) * 0.5) * 0.1;
  if (shakeT > 0) {
    cam.sway += (Math.random() * 2 - 1) * shakeA;
    cam.sy += (Math.random() * 2 - 1) * shakeA;
  }
}

function stepSim(dt) {
  T += dt;
  if (state === 'play') {
    updateWorld(dt); updatePlayer(dt); updateEntities(dt);
  } else if (state === 'title') {
    var p = player;
    p.x += 40 * dt; p.animT += dt;
    var wy = wireAt(p.x, p.lvl);
    if (wy === null) { p.lvl = 2; wy = wireAt(p.x, p.lvl); }
    p.y = wy === null ? LEVELS[2] : wy;
    updateEntities(dt);
  } else if (state === 'over') {
    overT += dt;
    updatePlayer(dt); updateEntities(dt);
  }
  updateCamera(dt);
  input.jump = false; input.down = false;
}

var errFlagged = false;
function frame(ts) {
  if (!last) last = ts;
  var dt = Math.min(0.06, (ts - last) / 1000);
  last = ts;
  acc += dt;
  var n = 0;
  while (acc >= STEP && n < 8) { if (!paused) stepSim(STEP); acc -= STEP; n++; }
  if (acc > STEP * 8) acc = 0;
  render();
  if (!errFlagged && (RUNTIME_ERRORS.length || ART_ERRORS.length)) {
    errFlagged = true;
    document.title = 'ERRORS ' + RUNTIME_ERRORS.concat(ART_ERRORS).join(' | ');
  }
  requestAnimationFrame(frame);
}

function drawPara(tile, para, y) {
  var tw = tile.width;
  var v = (cam.x * para + cam.sway * 0.6);
  var off = -((v % tw) + tw) % tw;
  for (var x = off - tw; x < W + tw; x += tw) g.drawImage(tile, Math.round(x), Math.round(y));
}

function drawWires() {
  var x0 = Math.floor(cam.x - 6), x1 = Math.ceil(cam.x + W + 6);
  var tag = 0, sp = mainSpanAt(cam.x + W * 0.5);
  if (sp) tag = sp.lvl;
  for (var lvl = 0; lvl < LEVELS.length; lvl++) {
    for (var x = x0; x <= x1; x++) {
      var y = wireAt(x, lvl);
      if (y === null) continue;
      var sx = Math.round(x - cam.x + cam.sway), sy = Math.round(y + cam.sy);
      if (sy < -4 || sy > H + 4) continue;
      var isMain = false;
      var msp = mainSpanAt(x);
      if (msp && msp.lvl === lvl) isMain = true;
      if (isMain) {
        g.fillStyle = '#333c58';
        g.fillRect(sx, sy, 1, 1);
        if ((x & 7) === 0) { g.fillStyle = '#7d8cb5'; g.fillRect(sx, sy - 1, 1, 1); }
      } else {
        g.fillStyle = '#0d0c16';
        g.fillRect(sx, sy, 1, 1);
        if ((x % 22) === 0) { g.fillStyle = '#2c3348'; g.fillRect(sx, sy - 1, 1, 1); }
      }
    }
  }
  for (var i = 0; i < world.gaps.length; i++) {
    var gp = world.gaps[i];
    for (var s = 0; s < 2; s++) {
      var gx = s === 0 ? gp.x0 - 1 : gp.x1 + 1;
      var gy = LEVELS[gp.lvl] + (s === 0 ? -1 : 0);
      var sx2 = Math.round(gx - cam.x + cam.sway), sy2 = Math.round(gy + cam.sy);
      for (var k = 0; k < 6; k++) {
        g.fillStyle = k < 3 ? '#333c58' : '#22283c';
        g.fillRect(sx2 + (s === 0 ? -k : k) * 0.4, sy2 + k, 1, 1);
      }
    }
  }
}

function ins(g, x, y) {
  rect(g, x, y, 2, 1, '#9fb0bd');
  rect(g, x, y + 1, 2, 2, '#6c7a86');
  rect(g, x - 1, y + 3, 4, 1, '#55606a');
  rect(g, x, y + 4, 2, 1, '#3a4048');
}

function drawPoles() {
  var pl = world.poles;
  for (var i = 0; i < pl.length; i++) {
    var sx = Math.round(pl[i] - cam.x + cam.sway);
    if (sx < -40) continue;
    if (sx > W + 40) break;
    var oy = cam.sy;
    var topY = LEVELS[0] - 22 + oy;
    rect(g, sx - 1, topY, 3, H - topY + 6, '#241c22');
    rect(g, sx - 1, topY, 1, H - topY + 6, '#332930');
    rect(g, sx + 1, topY, 1, H - topY + 6, '#120d12');
    rect(g, sx - 2, topY - 3, 5, 3, '#2c232a');
    for (var lvl = 0; lvl < LEVELS.length; lvl++) {
      var y = LEVELS[lvl] + 4 + oy;
      rect(g, sx - 8, y, 17, 2, '#2a2128');
      rect(g, sx - 8, y, 17, 1, '#3b3039');
      ins(g, sx - 6, LEVELS[lvl] - 1 + oy);
      ins(g, sx + 4, LEVELS[lvl] - 1 + oy);
    }
    rect(g, sx - 6, LEVELS[0] + 6 + oy, 13, 1, '#1e171d');
    rect(g, sx + 2, LEVELS[1] + 8 + oy, 6, 1, '#1e171d');
    if (i % 3 === 0) {
      g.globalAlpha = 0.5 + Math.sin(T * 2 + i) * 0.2;
      rect(g, sx - 1, topY - 5, 3, 3, '#ff4a4a');
      g.globalAlpha = 0.12;
      rect(g, sx - 3, topY - 7, 7, 7, '#ff4a4a');
      g.globalAlpha = 1;
    }
  }
}

function drawObstacles() {
  var s = world.spans;
  for (var i = Math.max(0, world.idx - 2); i < s.length; i++) {
    var sp = s[i];
    if (sp.x1 < cam.x - 20) continue;
    if (sp.x0 > cam.x + W + 20) break;
    if (sp.obs) {
      var sx = Math.round(sp.obs.x - cam.x + cam.sway);
      var oy = Math.round(spanY(sp, sp.obs.x) + cam.sy);
      if (sp.obs.t === 'drum') blit(g, art.drum, sx - 4, oy - 9);
      else blit(g, art.branch, sx - 5, oy - 6);
    }
    if (sp.shoes !== null && sp.shoes !== undefined) {
      var shx = Math.round(sp.shoes - cam.x + cam.sway);
      var shy = Math.round(spanY(sp, sp.shoes) + cam.sy);
      blit(g, art.shoes, shx, shy + 1);
    }
    if (sp.crow && !sp.crow.fly) {
      var cxp = Math.round(sp.crow.x - cam.x + cam.sway);
      var cyp = Math.round(spanY(sp, sp.crow.x) + cam.sy);
      blit(g, art.crowSit, cxp - 2, cyp - 4);
    }
  }
  for (var c = 0; c < crows.length; c++) {
    var cc = crows[c];
    blit(g, Math.floor(T * 12) % 2 ? art.crowFly0 : art.crowFly1, cc.x - cam.x + cam.sway - 2, cc.y + cam.sy - 2);
  }
  var s2 = world.spans;
  for (var k = Math.max(0, world.idx - 2); k < s2.length; k++) {
    if (s2[k].crow && s2[k].crow.fly) {
      var cr = s2[k].crow;
      blit(g, Math.floor(T * 12) % 2 ? art.crowFly0 : art.crowFly1, cr.x - cam.x + cam.sway - 2, cr.y + cam.sy - 2);
    }
  }
}

function drawPicks() {
  var s = world.spans;
  for (var i = Math.max(0, world.idx - 2); i < s.length; i++) {
    var sp = s[i];
    if (sp.x1 < cam.x - 20) continue;
    if (sp.x0 > cam.x + W + 40) break;
    for (var k = 0; k < sp.picks.length; k++) {
      var pk = sp.picks[k];
      if (pk.got) continue;
      var sx = pk.x - cam.x + cam.sway, sy = pk.y + cam.sy + Math.sin(T * 3 + pk.x * 0.3) * 1.6;
      g.globalAlpha = 0.09 + 0.05 * Math.sin(T * 5 + pk.x);
      g.fillStyle = '#8ff0ff';
      g.beginPath(); g.arc(sx, sy, 5.5, 0, 7); g.fill();
      g.globalAlpha = 1;
      blit(g, art.spark, sx - 1, sy - 1);
    }
  }
}

function drawPlayer() {
  var p = player;
  var sx = p.x - cam.x + cam.sway;
  var alpha = p.inv > 0 ? 0.5 : 1;
  if (p.state === 'run' || p.state === 'land') {
    var f = Math.floor(p.animT * 11) % 4;
    var land = p.state === 'land';
    var spr = land ? art.land : art.run[f];
    var bob = (!land && (f === 1 || f === 3)) ? -1 : 0;
    var top = p.y + cam.sy + bob - (spr.h - 1);
    blit(g, spr, sx - 9, top, false, alpha);
    if (!land) drawScarf(sx - 5, top + 12, alpha);
    var swing = land ? -0.1 : Math.sin(p.animT * 11) * 0.45;
    drawCane(sx + 4, top + (land ? 12 : 17), 0.5 + swing, alpha);
  } else if (p.state === 'air') {
    var rot = Math.min(1, p.flipT / 0.66) * 360;
    var idx = Math.floor(rot / 30) % 12;
    var ts = art.tuck[idx];
    var cx2 = sx, cy2 = p.y + cam.sy - 12;
    g.globalAlpha = alpha;
    blit(g, ts, cx2 - ts.w / 2, cy2 - ts.h / 2);
    g.globalAlpha = 1;
    var ang = rot * Math.PI / 180;
    var ox = 4, oy = -5;
    var hx = cx2 + ox * Math.cos(ang) - oy * Math.sin(ang);
    var hy = cy2 + ox * Math.sin(ang) + oy * Math.cos(ang);
    drawCane(hx, hy, ang + 0.9, alpha);
    g.globalAlpha = 0.16;
    g.fillStyle = '#dfe8f5';
    for (var w = 0; w < 3; w++) g.fillRect(Math.round(sx - 14 - w * 7), Math.round(p.y - 10 - w * 3), 5, 1);
    g.globalAlpha = 1;
  } else if (p.state === 'drop' || p.state === 'fall') {
    var fs = Math.floor(p.animT * 9) % 2;
    blit(g, art.fall[fs], sx - 9, p.y + cam.sy - 23, false, alpha);
    drawCane(sx + 5, p.y + cam.sy - 13, 2.1, alpha);
  } else if (p.state === 'dead') {
    var idx2 = Math.floor(p.deadT * 9) % 12;
    var ts2 = art.tuck[idx2];
    blit(g, ts2, sx - ts2.w / 2, p.y + cam.sy - 12 - ts2.h / 2, false, Math.max(0, 1 - p.deadT * 0.5));
  }
}

function drawCane(x, y, theta, alpha) {
  g.globalAlpha = alpha === undefined ? 1 : alpha;
  var dx = Math.sin(theta), dy = Math.cos(theta);
  for (var i = 0; i < 10; i++) {
    g.fillStyle = i < 8 ? '#7c5230' : '#b8863f';
    g.fillRect(Math.round(x + dx * i), Math.round(y + dy * i), 1, 1);
  }
  g.fillStyle = '#efe6d8';
  g.fillRect(Math.round(x), Math.round(y), 1, 1);
  g.globalAlpha = 1;
}

function drawScarf(x, y, alpha) {
  for (var i = 0; i < 6; i++) {
    var yy = y + 1 + Math.sin(T * 11 + i * 0.9) * 0.9 - i * 0.35;
    g.fillStyle = i < 4 ? '#c9455f' : '#8e2f45';
    g.fillRect(Math.round(x - i), Math.round(yy), 1, 1);
  }
}

function drawStreet() {
  var y = STREET_Y - 4 + cam.sy;
  drawPara(city.street, 0.62, y);
  for (var i = 0; i < cars.length; i++) {
    var c = cars[i];
    var sx = c.x - cam.x * 0.62 + cam.sway * 0.7;
    if (sx < -30 || sx > W + 30) continue;
    var cy = y + (c.lane === 0 ? 12 : 20);
    rect(g, sx - 5, cy, 11, 3, '#0d0b14');
    rect(g, sx - 4, cy - 1, 9, 1, '#1a1622');
    if (c.lane === 0) {
      rect(g, sx - 6, cy + 1, 2, 2, '#ffe9c0');
      rect(g, sx + 5, cy + 1, 2, 2, '#ffe9c0');
    } else {
      rect(g, sx - 6, cy + 1, 2, 2, c.col);
      rect(g, sx + 5, cy + 1, 2, 2, c.col);
    }
    g.globalAlpha = 0.16;
    rect(g, sx - 6, cy + 5, 13, 1, c.lane === 0 ? '#ffe9c0' : c.col);
    g.globalAlpha = 1;
  }
}

function drawRain() {
  if (rainFade <= 0.02 || tunnelAmt() > 0.4) return;
  g.globalAlpha = 0.16 * rainFade;
  g.fillStyle = '#cfe0f0';
  for (var i = 0; i < drops.length; i++) {
    var d = drops[i];
    for (var k = 0; k < d.l; k++) g.fillRect(Math.round(d.x + k * 0.42), Math.round(d.y + k), 1, 1);
  }
  g.globalAlpha = 1;
}

function tunnelAmt() {
  if (!tunnelNow) return 0;
  var a = clamp((player.x - tunnelNow.x0 + 70) / 150, 0, 1) * clamp((tunnelNow.x1 + 40 - player.x) / 150, 0, 1);
  return Math.max(0, a);
}

function drawTunnelBack(a) {
  g.globalAlpha = 1;
  g.fillStyle = '#05040a';
  g.fillRect(0, 0, W, H);
  drawPara(city.tunnel, 1.35, cam.sy);
  if (a < 1) {
    g.globalAlpha = 1 - a;
    g.drawImage(city.sky, Math.round(cam.sway * 0.3), 0);
    drawPara(city.far, 0.08, cam.sy * 0.4);
    drawPara(city.mid, 0.2, cam.sy * 0.7);
    drawStreet();
    drawPara(city.near, 1.45, cam.sy);
    g.globalAlpha = 1;
  }
}

function drawTunnelFront(a) {
  g.globalAlpha = a * 0.33;
  g.fillStyle = '#07060f';
  g.fillRect(0, 0, W, H);
  g.globalAlpha = 1;
  var lampSpacing = 260;
  var lampBase = Math.floor((cam.x * 1.35 - 100) / lampSpacing) * lampSpacing;
  for (var i = -1; i < 4; i++) {
    var sx = lampBase + i * lampSpacing - cam.x * 1.35;
    if (sx < -60 || sx > W + 60) continue;
    var gl2 = clamp(1 - Math.abs(sx - W * 0.45) / 240, 0, 1);
    g.globalAlpha = a * (0.2 + gl2 * 0.8);
    rect(g, sx - 9, 12, 18, 2, '#fff0cc');
    rect(g, sx - 30, 10, 60, 7, '#d99a52');
    g.globalAlpha = a * 0.13;
    rect(g, sx - 70, 6, 140, 16, '#ffb45a');
    g.globalAlpha = a * 0.18;
    rect(g, sx - 46, 26, 92, 3, '#ffd9a0');
    g.globalAlpha = a * 0.08;
    rect(g, sx - 26, 40, 52, 2, '#ffcf8a');
  }
  g.globalAlpha = 1;
}

function drawAtmosphere() {
  if (flashT > 0) {
    var fa = Math.sin(clamp(flashT / 0.3, 0, 1) * Math.PI) * 0.22;
    g.globalAlpha = fa;
    g.fillStyle = '#c8d8ff';
    g.fillRect(0, 0, W, H);
    g.globalAlpha = 1;
  }
}

function drawGlassDyn() {
  g.save();
  roundRectPath(g, WIN_L, WIN_T, W - WIN_L - WIN_R, H - WIN_T - WIN_B, 10);
  g.clip();
  var bx = ((T * 14) % 620) - 240;
  g.save();
  g.translate(bx, -40);
  g.rotate(0.34);
  g.globalAlpha = 0.032;
  g.fillStyle = '#cfe4ff';
  g.fillRect(0, 0, 38, 420);
  g.globalAlpha = 0.02;
  g.fillRect(56, 0, 16, 420);
  g.restore();
  var bx2 = ((-T * 6) % 760 + 760) % 760 - 260;
  g.save();
  g.translate(bx2, -30);
  g.rotate(-0.26);
  g.globalAlpha = 0.022;
  g.fillStyle = '#ffd9c0';
  g.fillRect(0, 0, 26, 400);
  g.restore();
  var p = player;
  var cx2 = p.x - cam.x + cam.sway;
  g.globalAlpha = 0.055;
  if (p.state === 'run' || p.state === 'land') {
    var f = Math.floor(p.animT * 11) % 4;
    var spr = p.state === 'land' ? art.land : art.run[f];
    var mirrored = W - cx2 - spr.w / 2;
    blit(g, spr, mirrored, p.y + cam.sy - (spr.h - 1), false, 0.055);
  }
  g.globalAlpha = 1;
  g.restore();
}

function drawSparkIcon(g, x, y) {
  g.fillStyle = '#3fd6f0';
  g.fillRect(x + 3, y, 3, 1); g.fillRect(x + 3, y + 6, 3, 1);
  g.fillRect(x + 2, y + 1, 5, 1); g.fillRect(x + 2, y + 5, 5, 1);
  g.fillRect(x + 1, y + 2, 7, 1); g.fillRect(x + 1, y + 4, 7, 1);
  g.fillRect(x, y + 3, 9, 1);
  g.fillStyle = '#c8f8ff';
  g.fillRect(x + 3, y + 2, 3, 3);
  g.fillStyle = '#ffffff';
  g.fillRect(x + 4, y + 3, 1, 1);
}

function drawHUD() {
  if (state === 'title') return;
  var dist = distM();
  drawTextOutline(g, dist + ' M', 30, 24, '#f2e8d4', '#150f1e', 2);
  var spStr = 'BEST ' + best;
  drawTextOutline(g, spStr, W - 30 - textW(spStr, 1), 26, '#c8b9a6', '#150f1e', 1);
  drawSparkIcon(g, 31, 41);
  drawTextOutline(g, ' ' + sparks, 38, 41, '#8ff0ff', '#150f1e', 1);
  drawTextOutline(g, (player.speed / 10).toFixed(1) + ' M/S', 30, 53, '#8fa0b8', '#150f1e', 1);
  for (var i = 0; i < floats.length; i++) {
    var fl = floats[i];
    var a = clamp(1 - fl.t / fl.life, 0, 1);
    g.globalAlpha = a;
    drawText(g, fl.txt, fl.x - cam.x - textW(fl.txt, 1) / 2, fl.y, fl.col, 1);
    g.globalAlpha = 1;
  }
}

function drawTitle() {
  var grd = g.createLinearGradient(0, 96, 0, 186);
  grd.addColorStop(0, 'rgba(10,7,20,0.55)');
  grd.addColorStop(0.25, 'rgba(10,7,20,0.72)');
  grd.addColorStop(1, 'rgba(10,7,20,0.4)');
  g.fillStyle = grd;
  g.fillRect(WIN_L, 96, W - WIN_L - WIN_R, 92);
  var cy = 100;
  drawTextCenter(g, 'LINE', W / 2 - 2, cy, '#ff4f9a', 5);
  drawTextCenter(g, 'LINE', W / 2 + 2, cy, '#22d3ff', 5);
  drawTextCenter(g, 'LINE', W / 2, cy, '#f6efe2', 5);
  drawTextCenter(g, 'JUMPER', W / 2 - 2, cy + 26, '#ff4f9a', 5);
  drawTextCenter(g, 'JUMPER', W / 2 + 2, cy + 26, '#22d3ff', 5);
  drawTextCenter(g, 'JUMPER', W / 2, cy + 26, '#f6efe2', 5);
  drawTextCenter(g, 'TOKYO EXPRESS - CAR 3 - WINDOW SEAT', W / 2, cy + 56, '#b9a7c4', 1);
  if (Math.floor(T * 2) % 2) drawTextCenter(g, 'PRESS SPACE OR TAP TO RIDE', W / 2, cy + 70, '#ffe9a8', 1);
  drawTextCenter(g, 'SPACE JUMP   DOWN DROP   M MUTE   R RESTART', W / 2, H - 32, '#77689a', 1);
}

function drawOver() {
  var a = clamp((overT - 0.45) * 1.4, 0, 1);
  if (a <= 0) return;
  g.globalAlpha = a * 0.72;
  g.fillStyle = '#07050c';
  g.fillRect(WIN_L, WIN_T, W - WIN_L - WIN_R, H - WIN_T - WIN_B);
  g.globalAlpha = a;
  drawTextCenterOutline(g, 'GAME OVER', W / 2, 58, '#ff6a6a', '#140d18', 4);
  drawTextCenter(g, deadMsg, W / 2, 88, '#e6d8c2', 1);
  drawTextCenter(g, 'DISTANCE ' + finalScore.dist + ' M', W / 2, 106, '#f2e8d4', 2);
  drawTextCenter(g, 'SPARKS X' + finalScore.sparks + '   STUNTS X' + finalScore.stunts, W / 2, 126, '#8ff0ff', 1);
  drawTextCenter(g, 'TOTAL ' + finalScore.total, W / 2, 136, '#ffd27a', 1);
  if (newBest) drawTextCenter(g, 'NEW BEST!', W / 2, 146, '#9fffa8', 1);
  else drawTextCenter(g, 'BEST ' + best, W / 2, 146, '#c8b9a6', 1);
  if (overT > 0.9 && Math.floor(T * 2) % 2) drawTextCenter(g, 'PRESS SPACE TO RIDE AGAIN', W / 2, 166, '#ffe9a8', 1);
  g.globalAlpha = 1;
}

function drawPause() {
  g.globalAlpha = 0.5;
  g.fillStyle = '#07050c';
  g.fillRect(WIN_L, WIN_T, W - WIN_L - WIN_R, H - WIN_T - WIN_B);
  g.globalAlpha = 1;
  drawTextCenterOutline(g, 'PAUSED', W / 2, 96, '#f2e8d4', '#140d18', 3);
  drawTextCenter(g, 'ESC TO RESUME', W / 2, 126, '#b9a7c4', 1);
}

function drawErrors() {
  var errs = RUNTIME_ERRORS.concat(ART_ERRORS);
  if (!errs.length) return;
  g.globalAlpha = 0.8;
  g.fillStyle = '#3a0000';
  g.fillRect(0, 0, W, 12 + errs.length * 8);
  g.globalAlpha = 1;
  drawText(g, 'ERRORS ' + errs.length, 2, 2, '#ff8a8a', 1);
  for (var i = 0; i < Math.min(4, errs.length); i++) drawText(g, errs[i].slice(0, 60), 2, 10 + i * 8, '#ffb0b0', 1);
}

function render() {
  g.clearRect(0, 0, W, H);
  var tunA = tunnelAmt();
  if (tunA > 0.01) drawTunnelBack(tunA);
  else {
    g.drawImage(city.sky, Math.round(cam.sway * 0.3), 0);
    drawPara(city.far, 0.08, cam.sy * 0.4);
    drawPara(city.mid, 0.2, cam.sy * 0.7);
    drawStreet();
    drawPara(city.near, 1.45, cam.sy);
  }
  for (var i = 0; i < steamParts.length; i++) {
    var st = steamParts[i];
    g.globalAlpha = clamp(st.life / st.max, 0, 1) * 0.14;
    g.fillStyle = '#cfd8e8';
    g.fillRect(Math.round(st.x), Math.round(st.y), Math.round(st.size), Math.round(st.size));
    g.globalAlpha = 1;
  }
  drawWires();
  drawPoles();
  drawObstacles();
  drawPicks();
  drawPlayer();
  for (var p2 = 0; p2 < parts.length; p2++) {
    var pt = parts[p2];
    g.globalAlpha = clamp(pt.life / pt.max, 0, 1);
    g.fillStyle = pt.col;
    g.fillRect(Math.round(pt.x - cam.x + cam.sway), Math.round(pt.y + cam.sy), pt.size, pt.size);
    g.globalAlpha = 1;
  }
  drawRain();
  if (tunA > 0.01) drawTunnelFront(tunA);
  drawAtmosphere();
  drawGlassDyn();
  g.drawImage(glassC, 0, 0);
  g.drawImage(frameC, 0, 0);
  drawHUD();
  if (state === 'title') drawTitle();
  if (state === 'over') drawOver();
  if (paused) drawPause();
  drawErrors();
  if (ZOOM > 1) g.drawImage(cv, ZOX - W / (2 * ZOOM), ZOY - H / (2 * ZOOM), W / ZOOM, H / ZOOM, 0, 0, W, H);
}

function scriptedInput() {
  var p = player;
  input.jumpHeld = (p.state === 'air' && p.flipT < 0.16);
  if (p.state !== 'run' && p.state !== 'land') return;
  var lvl = p.lvl;
  for (var i = 0; i < world.gaps.length; i++) {
    var gp = world.gaps[i];
    if (gp.lvl === lvl) {
      var d = gp.x0 - p.x;
      if (d > 0 && d < 14) { input.jump = true; input.jumpHeld = true; p.jumpBuf = JBUF; ai.jumps++; return; }
    }
  }
  var s = world.spans;
  for (var j = Math.max(0, world.idx - 1); j < s.length; j++) {
    var sp = s[j];
    if (sp.x0 > p.x + 90) break;
    if (sp.lvl === lvl && sp.obs) {
      var d2 = sp.obs.x - p.x;
      if (d2 > 8 && d2 < 30) { input.jump = true; input.jumpHeld = true; p.jumpBuf = JBUF; ai.jumps++; return; }
    }
  }
}

function simulate(secs, opt) {
  opt = opt || {};
  var t = 0, maxN = Math.ceil(secs / STEP);
  for (var n = 0; n < maxN; n++) {
    if (state === 'play') scriptedInput();
    if (opt.onStep) opt.onStep(t);
    stepSim(STEP);
    t += STEP;
    if (opt.stopWhen && opt.stopWhen(t)) break;
  }
  return t;
}

function drawTestReport(info) {
  g.globalAlpha = 0.88;
  g.fillStyle = '#080611';
  g.fillRect(0, 0, W, H);
  g.globalAlpha = 1;
  var errs = RUNTIME_ERRORS.concat(ART_ERRORS);
  var ok = errs.length === 0 && info.lands > 4 && info.jumps > 4;
  drawText(g, 'LINE JUMPER - SELF TEST', 8, 8, '#f2e8d4', 1);
  drawText(g, ok ? 'STATUS: PASS' : 'STATUS: CHECK', 8, 20, ok ? '#9fffa8' : '#ffb0b0', 2);
  var lines = [
    'TOTAL SIM     ' + info.t.toFixed(0) + ' S   ' + info.dist + ' M',
    'RUNNER STATE  ' + info.state,
    'JUMPS/ISSUED  ' + info.jumps + '/' + info.jumpsIssued,
    'LANDINGS      ' + info.lands,
    'GAP FALLS     ' + info.gapFalls,
    'DROPS TRIED   ' + info.drops,
    'STUNTS        ' + info.stunts,
    'SPARKS        ' + info.picks,
    'MAX LEVEL     ' + info.maxLvl,
    'PHASE1        ' + info.deaths,
    'STREET DEATHS ' + info.street,
    'SCORE         ' + info.score,
    'RUNTIME ERRS  ' + RUNTIME_ERRORS.length,
    'ART ERRS      ' + ART_ERRORS.length
  ];
  for (var i = 0; i < lines.length; i++) drawText(g, lines[i], 8, 42 + i * 9, '#cfe0f0', 1);
  for (var e = 0; e < Math.min(5, errs.length); e++) drawText(g, errs[e].slice(0, 58), 8, 42 + (lines.length + e) * 9, '#ff8a8a', 1);
  drawText(g, 'PRESS SPACE OR TAP TO PLAY', W / 2 - 78, H - 14, '#ffe9a8', 1);
}

function runSelfTest() {
  reset(false); state = 'play';
  var p1 = simulate(20);
  var r1 = {
    dist: distM(), jumps: player.stats.jumps, lands: player.stats.lands, gaps: player.stats.gapFalls,
    picks: player.stats.picks, st: state, deaths: (state !== 'play' ? 1 : 0)
  };
  if (state !== 'play') { reset(false); state = 'play'; }
  var attempted = 0, landed = 0, deaths = 0, lastDrop = -99;
  simulate(30, {
    onStep: function (t) {
      if (t - lastDrop > 7 && player.state === 'run' && player.lvl < 4) {
        lastDrop = t; attempted++;
        var from = player.lvl;
        doDrop();
        if (player.startLvl === from) { }
      }
    }
  });
  var dropsNow = player.stats.drops;
  render();
  var errs = RUNTIME_ERRORS.length + ART_ERRORS.length;
  drawTestReport({
    t: p1 + 30, state: state, dist: distM(), score: totalScore(),
    jumps: r1.jumps, jumpsIssued: ai.jumps, lands: r1.lands, gapFalls: r1.gaps,
    drops: dropsNow, stunts: stunts, picks: r1.picks, maxLvl: player.stats.maxLvl,
    street: (state === 'over' && deadMsg.indexOf('STREET') >= 0) ? 1 : 0,
    deaths: 'P1 ' + r1.dist + 'M  DROPS ' + attempted,
    errs: errs
  });
  document.title = errs === 0 ? 'TEST PASS' : 'TEST ERRORS ' + errs;
}

function runShot() {
  var pose = qs.get('pose') || 'run';
  var secs = parseFloat(qs.get('shot') || '4');
  if (pose === 'pause') {
    reset(false); state = 'play';
    simulate(secs);
    paused = true;
    render();
    paused = false;
    return;
  }
  if (pose === 'title') {
    reset(true); state = 'title';
    simulate(secs);
  } else {
    reset(false); state = 'play';
    if (qs.get('tun')) tunnelNow = { x0: 320, x1: 2600 };
    if (pose === 'air') simulate(secs, { stopWhen: function () { return player.state === 'air' && player.flipT > 0.26; } });
    else if (pose === 'drop') simulate(secs, { stopWhen: function () { return player.state === 'drop' && player.vy > 18; } });
    else if (pose === 'fall') simulate(secs, { stopWhen: function () { return player.state === 'fall' && player.vy > 10; } });
    else if (pose === 'over') { simulate(secs); if (state === 'play') gameOver('street'); simulate(1.6); }
    else simulate(secs);
  }
  render();
  document.title = 'SHOT ' + pose + ' ' + secs + (RUNTIME_ERRORS.length || ART_ERRORS.length ? ' ERRS ' + (RUNTIME_ERRORS.length + ART_ERRORS.length) : ' OK');
}

function onKey(e, down) {
  var code = e.code;
  if (code === 'Space' || code === 'ArrowUp' || code === 'KeyW' || code === 'KeyZ') {
    e.preventDefault();
    if (down) {
      input.jump = true; input.jumpHeld = true;
      if (state === 'title') startGame();
      else if (state === 'over' && overT > 0.6) startGame();
      else if (state === 'play') player.jumpBuf = JBUF;
    } else input.jumpHeld = false;
    return;
  }
  if (code === 'ArrowDown' || code === 'KeyS') {
    e.preventDefault();
    if (down) {
      input.down = true;
      if (state === 'play' && (player.state === 'run' || player.state === 'land')) doDrop();
      else if (state === 'play' && player.state === 'air' && player.vy > -30) player.vy += 90;
    } else input.downHeld = false;
    return;
  }
  if (!down) return;
  if (code === 'KeyM') { audio.init(); audio.toggleMute(); }
  if (code === 'KeyR') startGame();
  if (code === 'Escape' || code === 'KeyP') { if (state === 'play') paused = !paused; }
}
document.addEventListener('keydown', function (e) { if (e.repeat) { if (e.code === 'Space' || e.code.indexOf('Arrow') === 0) e.preventDefault(); return; } onKey(e, true); });
document.addEventListener('keyup', function (e) { onKey(e, false); });
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  audio.init(); audio.resume();
  if (state === 'title' || (state === 'over' && overT > 0.6)) { startGame(); return; }
  var r = cv.getBoundingClientRect();
  var y = (e.clientY - r.top) / r.height;
  if (y < 0.62) { input.jump = true; input.jumpHeld = true; if (state === 'play') player.jumpBuf = JBUF; }
  else { input.down = true; if (state === 'play' && (player.state === 'run' || player.state === 'land')) doDrop(); }
});
cv.addEventListener('pointerup', function () { input.jumpHeld = false; });
document.addEventListener('visibilitychange', function () { if (document.hidden && state === 'play') paused = true; });
window.addEventListener('blur', function () { if (state === 'play') paused = true; });

best = loadBest();
if (qs.get('tun')) tunnelNow = null;
if (qs.get('play')) {
  reset(false);
  state = 'play';
  if (qs.get('tun')) tunnelNow = { x0: 320, x1: 2200 };
  requestAnimationFrame(frame);
} else if (MODE === 'shot') {
  runShot();
} else if (MODE === 'test') {
  runSelfTest();
} else {
  reset(false);
  state = 'title';
  requestAnimationFrame(frame);
}

</script>
